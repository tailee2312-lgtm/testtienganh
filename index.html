 };pass=(rules[q.n]||(()=>false))();
 }else if(q.section==='word')pass=n===normalize(q.mark);
 else if(q.section==='transform')pass=(n.split(' ').length<=5)&&normalize(q.mark)===n;
 else if(q.section==='reading'){
 const f=n;
 if(q.n===19)pass=/pay/.test(f)&&/college|school|university|tuition/.test(f);
 if(q.n===20)pass=/loan/.test(f)&&/job|work|employment/.test(f)&&/scholarship/.test(f);
 if(q.n===21)pass=/provid|show|give|submit/.test(f)&&/income|earn|salary|money|parent|financial/.test(f);
 if(q.n===22)pass=/government/.test(f)&&/compan|donat|business/.test(f);
 }
 if(pass)return {points:q.pts,status:'correct',pending:false};
 if(q.section==='word'&&n.split(' ').length===1)return {points:0,status:'incorrect',pending:false};
 if(q.section==='transform'&&n.split(' ').length>5)return {points:0,status:'incorrect',pending:false};
 // A non-matching written answer might be a valid paraphrase. Reserve it for review instead of falsely declaring it wrong.
 return {points:0,status:'pending',pending:true};
}
function mark(q){if(!state.finished)return null;const manual=state.manualScores[q.n];if(q.kind==='mc'){
 const ans=state.answers[q.n]||'';return{points:ans===q.mark?q.pts:0,status:!ans?'empty':ans===q.mark?'correct':'incorrect',pending:false};
 }
 const m=autoMarkWrite(q);
 if(manual!==undefined&&manual!==null){const pts=Number(manual);return{points:pts,status:pts>=q.pts?'correct':pts>0?'partial':'incorrect',pending:false,manual:true};}
 return m;
}

 return{score:Math.round(score*100)/100,pending,pendingPts:Math.round(pendingPts*100)/100,correct,attempted,total:qs.length};}

 }
 if(current.id==='exam2026'&&kind==='paragraph'){
  if(text.startsWith('Exercise is good for health'))terms=['underlying'];
  if(text.startsWith('Several factors can increase'))terms=['These'];
  if(text.startsWith('Exercise can help protect health'))terms=['intense','The body needs time to adjust to a new level of effort.'];
  if(text.startsWith('Urban dwellers once defined'))terms=['measures'];
  if(text.startsWith('This emphasis on wellness'))terms=['They'];
 }
 terms.sort((a,b)=>b.length-a.length);
 for(const term of terms){const safe=esc(term);s=s.replace(safe,'<u class="paper-underline">'+safe+'</u>')}
 return s;
}
function optionHtml(item,i){
 let s=esc(item.options[i]);if(item.under==='ed')s=s.replace(/ed$/i,'<u class="paper-underline">ed</u>');else if(item.under==='s')s=s.replace(/s$/i,'<u class="paper-underline">s</u>');
 if(current.id==='exam2022'&&item.n===1)s=s.replace(/^(Ch|ch)/,'<u class="paper-underline">$1</u>');
 if(current.id==='exam2022'&&item.n===2)s=s.replace('l','<u class="paper-underline">l</u>');
 if(current.id==='bacninh'&&item.n===1)s=s.replace('o','<u class="paper-underline">o</u>');
 if(current.id==='bacninh'&&item.n===2)s=s.replace(/ed$/,'<u class="paper-underline">ed</u>');
 return s;
}
function cleanExplanation(q){let x=String(q.explain||'Theo đáp án của đề đã cung cấp.');
 const m=x.match(/Giải thích\s*:/i);if(m&&m.index<340)x=x.slice(m.index+m[0].length).trim();
 x=x.split(/\s[•▪]\s/)[0].trim();
 if(x.length>680)x=x.slice(0,680).replace(/\s+\S*$/,'')+'…';
 return x||'Theo đáp án được cung cấp.';
}
function makeBlock(item,index){const b=document.createElement('div');b.dataset.block=String(index);if(item.t!=='q'){
 b.className='paper-content '+({heading:'exam-heading',instruction:'exam-instruction',subheading:'exam-subheading',paragraph:'exam-paragraph',credit:'exam-credit'}[item.t]||'exam-paragraph');
 b.innerHTML=rich(item.text,item.t,index);
 if(item.t==='paragraph'||item.t==='instruction'){
  b.classList.add('text-selectable');const stamp=state.inks[index];if(stamp&&typeof stamp==='string'&&stamp.length<25000)b.innerHTML=stamp;
 }
 return b;}
 b.className='exam-question';if(!item.stem?.length)b.classList.add('no-stem');b.id='q-'+item.n;b.dataset.q=String(item.n);
 if(state.finished){const m=mark(item);b.classList.add('graded',m.status==='correct'?'correct':m.status==='pending'?'pending':'incorrect')}
 const actions=document.createElement('div');actions.className='question-actions';
 actions.innerHTML=`<button class="paper-mini flag-btn ${state.flags[item.n]?'flagged':''}" data-action="flag" data-q="${item.n}" aria-label="Flag question ${item.n}" title="Đánh dấu câu">${state.flags[item.n]?'⚑':'⚐'}</button><button class="paper-mini" data-action="note" data-q="${item.n}" aria-label="Note for question ${item.n}" title="Ghi chú">✎</button>`;
 b.append(actions);
 const prompt=document.createElement('div');prompt.className='q-prompt';
 const first=item.stem?.[0]||'';prompt.innerHTML=`<span class="qno">${current.id==='bacninh'?item.n+'.':'Question '+item.n+'.'}</span> ${rich(first,'stem',item.n)}`;
 if(state.finished){const m=mark(item);let tag=m.status==='correct'?'✓':m.status==='pending'?'?':m.status==='partial'?'◐':'×';prompt.innerHTML+=`<span class="grade-indicator">${tag} ${parseGradedValue(m.points)}/${parseGradedValue(item.pts)} pt</span>`}
 b.append(prompt);
 if((item.stem||[]).length>1){for(let i=1;i<item.stem.length;i++){
 const l=document.createElement('div');l.className='q-stem-line'+(/^(\([a-e]\)|[\w\s]+:)/.test(item.stem[i])?' indent':'');l.textContent=item.stem[i];l.classList.add('text-selectable');const key=index+'-stem'+i;if(state.inks[key])l.innerHTML=state.inks[key];l.dataset.ink=key;b.append(l);
 }}
 if(item.kind==='mc'){
  const opts=document.createElement('div');let max=Math.max(...item.options.map(v=>String(v).length));
  const cols=max>62?1:max>18?2:4;
  opts.className='option-group '+(cols===4?'col4':cols===2?'col2':'col1');
  for(let i=0;i<4;i++){
   let o=document.createElement('button');o.className='option';o.type='button';o.dataset.action='answer';o.dataset.q=String(item.n);o.dataset.val='ABCD'[i];o.setAttribute('aria-label',`Question ${item.n} option ${'ABCD'[i]} ${item.options[i]}`);
   o.setAttribute('aria-pressed',String(state.answers[item.n]==='ABCD'[i]));
   if(state.answers[item.n]==='ABCD'[i])o.classList.add('selected');
   if(state.finished){if(item.mark==='ABCD'[i])o.classList.add('correct-option');if(state.answers[item.n]==='ABCD'[i]&&item.mark!=='ABCD'[i])o.classList.add('wrong-option');o.disabled=true;}
   o.innerHTML=`<span class="opt-letter">${'ABCD'[i]}.</span><span class="opt-text">${optionHtml(item,i)}</span>`;
   opts.append(o);
  }
  b.append(opts);
 }else if(item.section==='mistake'){
  const answer=state.answers[item.n]||{};const row=document.createElement('div');row.className='mistake-pair';row.innerHTML=`<label>Chỗ sai: <input data-writing="wrong" data-q="${item.n}" aria-label="Question ${item.n} wrong word" value="${esc(answer.wrong||'')}" placeholder="...................." ${state.finished?'disabled':''}></label><label>Sửa thành: <input data-writing="fix" data-q="${item.n}" aria-label="Question ${item.n} correction" value="${esc(answer.fix||'')}" placeholder="...................." ${state.finished?'disabled':''}></label>`;b.append(row);
 }else{
  const line=document.createElement('div');line.className='answer-row '+(['word','transform'].includes(item.section)?'short':item.section==='reading'?'reading':'');
  const starter=esc(item.starter||'→ ');const ans=esc(state.answers[item.n]||'');
  line.innerHTML=`<span class="answer-starter">${starter}</span><textarea rows="1" data-writing="text" data-q="${item.n}" class="answer-field" aria-label="Write answer for question ${item.n}" placeholder="Nhập câu trả lời…" ${state.finished?'disabled':''}>${ans}</textarea>`;b.append(line);
 }
 if(state.notes[item.n]){
 const note=document.createElement('div');note.className='note-editor';note.dataset.notes=String(item.n);note.innerHTML=`<div class="note-head">Ghi chú riêng</div><textarea data-note="${item.n}" aria-label="Note for question ${item.n}" placeholder="Nhập ghi chú…">${esc(state.notes[item.n])}</textarea>`;b.append(note);
 }
 if(state.finished){const m=mark(item);if(item.kind==='write'){
 if(m.status==='pending'){const notice=document.createElement('div');notice.className='grader-note';notice.textContent='Câu trả lời này cần kiểm tra thêm; điểm hiện tại là tạm tính.';b.append(notice)}
 }
 if(state.showExplanations){const rev=document.createElement('div');rev.className='answer-review';
 const answer=item.kind==='mc'?`${item.mark}. ${item.options['ABCD'.indexOf(item.mark)]}`:item.section==='mistake'?`Mistake: ${item.mark[0]}; Correction: ${item.mark[1]}`:String(item.mark);
 rev.innerHTML=`<span class="review-title">Đáp án: ${esc(answer)}.</span> <span class="solution">${esc(cleanExplanation(item))}</span>`;
 if(item.kind==='write'){
 const opts=[0];for(let val=.25;val<item.pts;val+=.25)if(current.id==='bacninh')opts.push(Number(val.toFixed(2)));
 opts.push(item.pts);const chosen=state.manualScores[item.n];
 rev.innerHTML+=`<div class="manual-ctrl">Giáo viên chỉnh điểm: <select data-override="${item.n}" aria-label="Manual score for question ${item.n}"><option value="auto" ${chosen==null?'selected':''}>Automatic</option>${[...new Set(opts)].map(x=>`<option value="${x}" ${chosen===x?'selected':''}>${parseGradedValue(x)} pt</option>`).join('')}</select></div>`;
 }
 b.append(rev)}
 }
 return b;
}
function createSheet(i){const sheet=document.createElement('section');sheet.className='paper-sheet';sheet.dataset.page=String(i);sheet.innerHTML=`<div class="sheet-body"></div><footer class="sheet-footer"><span>${current.id==='bacninh'?'SỞ GD&ĐT BẮC NINH':'ENGLISH · GRADE 11'}</span><span>Page ${i} &nbsp;·&nbsp; ${esc(current.year)}</span></footer>`;PAGES.append(sheet);return sheet.querySelector('.sheet-body')}
function paginate(){
 const blocks=Array.from(PAGES.querySelectorAll('[data-block]'));if(!blocks.length)return;
 const header=PAGES.querySelector('.paper-header');PAGES.innerHTML='';
 let body=createSheet(1);if(header)body.append(header);let idx=1,placed=0;
 const mobile=window.matchMedia('(max-width:760px)').matches;
 const pageRoom=()=>{const rect=body.getBoundingClientRect();return mobile?Math.max(720,window.innerHeight*1.12):body.clientHeight};
 for(let n=0;n<blocks.length;n++){
  const node=blocks[n];body.append(node);
  const top=body.getBoundingClientRect().top;
  const nodeBottom=node.getBoundingClientRect().bottom;
  const nodeMargin=parseFloat(getComputedStyle(node).marginBottom)||0;
  const reserve=(node.classList.contains('exam-heading')||node.classList.contains('exam-instruction'))?Math.min(105, n<blocks.length-1?55:0):0;
  const tooMuch=nodeBottom+nodeMargin+reserve>top+pageRoom()-10;
  if(tooMuch && placed>0){body.removeChild(node);idx++;body=createSheet(idx);body.append(node);placed=1;}
  else placed++;
  // Never let an unusually long explanation overlap the footer or next page.
  const heightNow=node.getBoundingClientRect().bottom-body.getBoundingClientRect().top+17;
  if(!mobile && heightNow>body.clientHeight){body.closest('.paper-sheet')?.classList.add('oversize-sheet')}
 }
 const sheets=PAGES.querySelectorAll('.paper-sheet');sheets.forEach((sh,i)=>{sh.querySelector('.sheet-footer span:last-child').textContent=`Trang ${i+1} / ${sheets.length} · ${current.year}`});
}

function renderPages(){PAGES.innerHTML='';const b=createSheet(1);b.append(buildHeader());current.items.forEach((item,index)=>b.append(makeBlock(item,index)));
 const end=document.createElement('div');end.className='exam-end';end.textContent='----- THE END -----';end.dataset.block=String(current.items.length);b.append(end);
 PAGES.querySelectorAll('textarea.answer-field').forEach(autoSize);paginate();
 const t=totals();const banner=$('#result-banner');if(false && state.finished){banner.style.display='block';banner.innerHTML=`<strong>Paper submitted · ${t.score.toFixed(2)} / 10</strong>${t.pending?` <span class="pending-note">· ${t.pending} written answer(s) need review (${t.pendingPts.toFixed(2)} potential points). The displayed score is provisional.</span>`:''}<span style="display:block">${t.correct} fully correct question(s) · ${t.attempted}/${t.total} attempted. ${state.showExplanations?'Explanations are shown below each question.':'Select “Explanations” to see the marking key and solutions.'}</span>`;
 }else banner.style.display='none';
 renderNav();renderProgress();}
function autoSize(el){if(!el||el.tagName!=='TEXTAREA')return;el.style.height='auto';const min=Number(el.dataset.minheight)||31;el.style.height=Math.max(min,el.scrollHeight+1)+'px'}
function renderNav(){const qs=getQuestions();const t=totals();RAIL.innerHTML='';for(const q of qs){const b=document.createElement('button');b.className='q-nav';b.type='button';b.textContent=q.n;b.setAttribute('aria-label','Đến câu '+q.n);b.dataset.jump=q.n;if(isAnswered(q))b.classList.add('answered');if(state.flags[q.n])b.classList.add('flagged');if(state.finished){const m=mark(q);const color=m.status==='correct'?'right':m.status==='pending'?'pending':m.status==='empty'?'':'wrong';if(color)b.classList.add(color);}RAIL.append(b)}
 const status=$('#rail-score');status.textContent=state.finished?`${t.score.toFixed(2)} / 10`:`${t.attempted} / ${t.total}`;
 $('#rail-warning').textContent=state.finished?(t.pending?`${t.pending} câu tự luận cần kiểm tra.`:'Đã chấm xong.'):'Nhấn số để đến câu hỏi.';
}
function replaceSelected(q,val){state.answers[q]=val;beginIfNeeded();scheduleSave();renderNav();renderProgress();const el=$('#q-'+q);el?.querySelectorAll('.option').forEach(o=>{let active=o.dataset.val===val;o.classList.toggle('selected',active);o.setAttribute('aria-pressed',String(active))})}
function noteToggle(q){const el=$('#q-'+q);if(!el)return;let panel=el.querySelector('.note-editor');if(panel){panel.remove();return}
 panel=document.createElement('div');panel.className='note-editor';panel.dataset.notes=q;panel.innerHTML=`<div class="note-head">Ghi chú riêng</div><textarea data-note="${q}" aria-label="Note for question ${q}" placeholder="Nhập ghi chú…">${esc(state.notes[q]||'')}</textarea>`;el.append(panel);panel.querySelector('textarea').focus();}
function jump(q){const element=$('#q-'+q);if(element){element.scrollIntoView({behavior:'smooth',block:'center'});element.animate([{background:'#fff6d9'},{background:'#fff'}],{duration:1400,easing:'ease-out'})}}
function dialog(title,text,buttons){return new Promise(resolve=>{const wrap=$('#modal-backdrop');wrap.hidden=false;wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="modal-actions"></div></div>`;const holder=wrap.querySelector('.modal-actions');buttons.forEach(x=>{let b=document.createElement('button');b.textContent=x.label;b.className=x.kind||'';b.addEventListener('click',()=>{wrap.hidden=true;wrap.innerHTML='';resolve(x.value)});holder.append(b)});holder.querySelector('button').focus()})}
async function submit(auto=false){if(state.finished)return;let count=countAnswered(),total=getQuestions().length;
 if(!auto){let yes=await dialog('Nộp bài kiểm tra?',`Bạn đã làm ${count}/${total} câu. Sau khi nộp sẽ không thể sửa đáp án.`,[{label:'Làm tiếp',value:false},{label:'Nộp bài',kind:'primary',value:true}]);if(!yes)return;}
 state.finished=true;state.running=false;state.showExplanations=false;save();renderTop();renderPages();window.scrollTo({top:0,behavior:'smooth'});notify(auto?'Hết giờ. Bài đã được nộp.':'Đã chấm bài. Điểm nằm ở đầu đề.');}
async function reset(){let yes=await dialog('Làm lại đề này?',`Xóa toàn bộ câu trả lời, ghi chú và điểm của đề này?`,[{label:'Hủy',value:false},{label:'Xóa và làm lại',value:true,kind:'danger'}]);if(!yes)return;state=fresh(current);save();renderTop();renderPages();window.scrollTo(0,0);notify('Đã làm mới đề.');}
function selectTest(id){if(id===current.id)return;save();current=TOTALS[id]||EXAMS[0];state=fresh(current);lastTick=Date.now();save();savedSelection=null;renderTop();renderPages();window.scrollTo({top:0,behavior:'instant'});notify('Đề mới đã sẵn sàng. Bài làm bắt đầu từ đầu.');}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await ROOT.requestFullscreen({navigationUI:'hide'});}catch(e){notify('Trình duyệt chặn toàn màn hình. Bạn có thể nhấn F11.')}renderTop()}
function print(){save();window.print()}
function setupSelection(){document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return;const r=s.getRangeAt(0),host=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;if(host?.closest?.('.text-selectable'))savedSelection=r.cloneRange();});}
function annotate(style){const r=savedSelection;if(!r||r.collapsed){notify('Hãy bôi đen đoạn văn trước.');return;}const parent=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;const host=parent?.closest?.('.text-selectable');if(!host){notify('Chỉ đánh dấu được đoạn văn hoặc hướng dẫn.');return;}if(style==='clear'){
 host.querySelectorAll('.marked-highlight,.marked-underline').forEach(span=>span.replaceWith(document.createTextNode(span.textContent)));host.normalize();
 }else{
 const tag=document.createElement('span');tag.className=style==='underline'?'marked-underline':'marked-highlight';try{r.surroundContents(tag);}catch{try{tag.append(r.extractContents());r.insertNode(tag);}catch{notify('Hãy chọn một đoạn ngắn hơn.');return;}}
 }
 const inkKey=host.dataset.ink??host.dataset.block;state.inks[inkKey]=host.innerHTML;savedSelection=null;window.getSelection()?.removeAllRanges();scheduleSave();notify(style==='clear'?'Đã xóa dấu.':'Đã đánh dấu.');}
function addListeners(){
 $('#exam-select').addEventListener('change',e=>selectTest(e.target.value));
 $('#fullscreen-btn').addEventListener('click',fullscreen);document.addEventListener('fullscreenchange',renderTop);
 $('#pause-btn').addEventListener('click',startClock);$('#submit-btn').addEventListener('click',()=>submit(false));$('#bottom-submit').addEventListener('click',()=>submit(false));
 $('#print-btn').addEventListener('click',print);$('#reset-btn').addEventListener('click',reset);$('#explanations-btn').addEventListener('click',()=>{if(!state.finished)return;state.showExplanations=!state.showExplanations;save();renderTop();renderPages();notify(state.showExplanations?'Đã hiển thị lời giải.':'Đã ẩn lời giải.');});
 $('#highlight-btn').addEventListener('click',()=>annotate('highlight'));$('#underline-btn').addEventListener('click',()=>annotate('underline'));$('#erase-btn').addEventListener('click',()=>annotate('clear'));
 $('#bottom-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
 RAIL.addEventListener('click',e=>{const hit=e.target.closest('[data-jump]');if(hit)jump(hit.dataset.jump)});
 $('#pages').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const q=Number(btn.dataset.q);if(btn.dataset.action==='answer'){if(state.finished)return;replaceSelected(q,btn.dataset.val)}
 else if(btn.dataset.action==='flag'){state.flags[q]=!state.flags[q];btn.classList.toggle('flagged',state.flags[q]);btn.textContent=state.flags[q]?'⚑':'⚐';scheduleSave();renderNav();}
 else if(btn.dataset.action==='note'){noteToggle(q)};
 });
 $('#pages').addEventListener('input',e=>{let el=e.target;if(el.dataset.idkey){state.identity[el.dataset.idkey]=el.value;beginIfNeeded();scheduleSave();return}
 if(el.dataset.writing){const q=Number(el.dataset.q);if(el.dataset.writing==='text'){state.answers[q]=el.value;autoSize(el)}else{state.answers[q]??={wrong:'',fix:''};state.answers[q][el.dataset.writing]=el.value}beginIfNeeded();scheduleSave();renderNav();renderProgress();return}
 if(el.dataset.note){state.notes[el.dataset.note]=el.value;scheduleSave();}
 });
 $('#pages').addEventListener('change',e=>{const target=e.target;if(target.dataset.override){const q=Number(target.dataset.override);if(target.value==='auto')delete state.manualScores[q];else state.manualScores[q]=Number(target.value);save();renderPages();notify('Đã cập nhật điểm.')}});
 $('#pages').addEventListener('focusout',e=>{if(e.target.matches('textarea.answer-field')){setTimeout(()=>{if(!document.activeElement?.closest('.answer-row'))repaginateOnly()},80)}});
 $('#jump-menu').addEventListener('click',()=>{const first=getQuestions().find(q=>!isAnswered(q));jump((first||getQuestions()[0]).n)});
 $('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop'){e.currentTarget.hidden=true;e.currentTarget.innerHTML=''}});
 window.addEventListener('beforeprint',()=>{save()});
 // Resize only when meaningful; input focus and notes are preserved because DOM nodes are moved, not regenerated.
 let lastWidth=window.innerWidth;
 window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lastWidth)>40){lastWidth=window.innerWidth;clearTimeout(window._paperResize);window._paperResize=setTimeout(repaginateOnly,240)}});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){/* browser print */}if(e.key==='Escape'&&$('#modal-backdrop').hidden===false){$('#modal-backdrop').hidden=true}})
}
function repaginateOnly(){if(!state)return;const active=document.activeElement;if(active?.matches('[data-writing]'))return;const savedScroll=window.scrollY;paginate();window.scrollTo({top:savedScroll,behavior:'instant'});}
function init(){state=getState(current);setupSelection();addListeners();renderTop();renderPages();clearInterval(tick);tick=setInterval(updateTime,500);}
init();
})();
</script></body></html>
