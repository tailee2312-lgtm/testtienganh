ve very few or even totally missing green spaces with higher amount of pollution. Gradually, the citizens who have experienced pollution every day suffer from various diseases like lung cancers, asthma and bronchitis. Another disadvantage of living in a city is traffic congestion. Every day, many people have to struggle with traffic jams, so they are sometimes late for work or stuck on the roads for over fifteen minutes. In addition, too many vehicles on the street during rush hours are one of the causes of traffic accidents. It is undeniable that the cost of living in big cities is much higher than that in the countryside. The impact of this can result in the high costs of the public services, such as healthcare, food and education. It is difficult for the poor and workers to live in big cities with low wages. They seem to struggle with the fast changes in the prices of basic necessities and public services like hospitals and schools. In conclusion, the more people live in a city, the more social issues they have to deal with. It is urgent that local governments find effective solutions to make sure a healthy living environment for their citizens."},{"t":"q","n":26,"stem":["What does the passage mainly discuss?"],"kind":"mc","section":"general","pts":0.25,"options":["advantages of living in big cities","disadvantages of living in big cities","living in big cities","good services of big cities"],"mark":"B","explain":"Kiến thức: Kỹ năng đọc hiểu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":27,"stem":["Why are lung cancers, asthma and bronchitis mentioned in the second paragraph?"],"kind":"mc","section":"general","pts":0.25,"options":["because they are common diseases","because they are the effect of pollution in big cities","because they are harmful for citizens","because they are dangerous"],"mark":"B","explain":"Kiến thức: Kỹ năng đọc hiểu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."}  RAIL.addEventListener('click',e=>{const hit=e.target.closest('[data-jump]');if(hit)jump(hit.dataset.jump)});
 $('#pages').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const q=Number(btn.dataset.q);if(btn.dataset.action==='answer'){if(state.finished)return;replaceSelected(q,btn.dataset.val)}
 else if(btn.dataset.action==='flag'){state.flags[q]=!state.flags[q];btn.classList.toggle('flagged',state.flags[q]);btn.textContent=state.flags[q]?'⚑':'⚐';scheduleSave();renderNav();}
 else if(btn.dataset.action==='note'){noteToggle(q)};
 });
 $('#pages').addEventListener('input',e=>{let el=e.target;if(el.dataset.idkey){state.identity[el.dataset.idkey]=el.value;beginIfNeeded();scheduleSave();return}
 if(el.dataset.writing){const q=Number(el.dataset.q);if(el.dataset.writing==='text'){state.answers[q]=el.value;autoSize(el)}else{state.answers[q]??={wrong:'',fix:''};state.answers[q][el.dataset.writing]=el.value}beginIfNeeded();scheduleSave();renderNav();renderProgress();return}
 if(el.dataset.note){state.notes[el.dataset.note]=el.value;scheduleSave();}
 });
 $('#pages').addEventListener('change',e=>{const target=e.target;if(target.dataset.override){const q=Number(target.dataset.override);if(target.value==='auto')delete state.manualScores[q];else state.manualScores[q]=Number(target.value);save();renderPages();notify('Đã cập nhật điểm.')}});
 $('#pages').addEventListener('focusout',e=>{if(e.target.matches('textarea.answer-field')){setTimeout(()=>{if(!document.activeElement?.closest('.answer-row'))repaginateOnly()},80)}});
 $('#jump-menu').addEventListener('click',()=>{const first=getQuestions().find(q=>!isAnswered(q));jump((first||getQuestions()[0]).n)});
 $('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop'){e.currentTarget.hidden=true;e.currentTarget.innerHTML=''}});
 window.addEventListener('beforeprint',()=>{save()});
 // Resize only when meaningful; input focus and notes are preserved because DOM nodes are moved, not regenerated.
 let lastWidth=window.innerWidth;
 window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lastWidth)>40){lastWidth=window.innerWidth;clearTimeout(window._paperResize);window._paperResize=setTimeout(repaginateOnly,240)}});
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){/* browser print */}if(e.key==='Escape'&&$('#modal-backdrop').hidden===false){$('#modal-backdrop').hidden=true}})
}
function repaginateOnly(){if(!state)return;const active=document.activeElement;if(active?.matches('[data-writing]'))return;const savedScroll=window.scrollY;paginate();window.scrollTo({top:savedScroll,behavior:'instant'});}
function init(){state=getState(current);setupSelection();addListeners();renderTop();renderPages();clearInterval(tick);tick=setInterval(updateTime,500);}
init();
})();
</script></body></html>
