:root{--canvas:#e9edf2;--ui:#182638;--accent:#2157a7}
body{color:#202630}
.topbar{gap:10px;min-height:62px;padding:10px 20px;box-shadow:0 2px 10px #0d162626}
.brand{font-size:14px;letter-spacing:.015em;gap:10px}
.exam-picker{height:40px;max-width:365px;font-size:13px;min-width:180px;border-radius:7px;padding:7px 12px}
.clock{height:38px;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:15px}
.top-actions{gap:6px}
.ui-btn{height:38px;font-size:13px;letter-spacing:0;border-radius:7px;padding:8px 12px}
.ui-btn.primary{background:#d9e8ff;border-color:#d9e8ff;color:#102a4c}
.toolbar-secondary{top:62px;min-height:46px;padding:6px 15px;gap:14px;justify-content:center;border-color:#dce3eb;box-shadow:0 2px 8px #1e2b3810}
.tool-group{display:flex;align-items:center;gap:6px}
.toolbtn{font-size:12px;letter-spacing:0;border-radius:6px;padding:7px 11px;font-weight:600}
.toolbar-tip{font-size:11px;color:#64748b;white-space:nowrap}
.layout{gap:18px;margin:23px auto 70px}
.paper-sheet{box-shadow:0 4px 23px #27344917;border:1px solid #dfe3e9;font-size:15.5px;line-height:1.38}
.exam-question{line-height:1.36;margin:9px 0 11px}
.option{font-size:15px;line-height:1.3;padding:2px 2px 2px 0}
.opt-letter{min-width:22px;height:20px}
.option-group{gap:3px 8px;margin:4px 0 0 15px}
.header-meta{margin-top:6px;min-height:65px;justify-content:flex-end}
.meta-intro:empty{display:none}
.paper-identity{margin:8px 0 15px;grid-template-columns:1.5fr .55fr 1fr}
.score-box:before{content:'ĐIỂM';font-size:11px}
.right-rail{padding:17px 14px;top:125px;flex-basis:199px;border-radius:9px;max-height:calc(100vh - 145px)}
.rail-title{letter-spacing:.035em;color:#334155;font-size:12px}
.rail-sub{font-size:12px;margin-top:4px}
.rail-grid{gap:6px}
.q-nav{font-size:12px;border-radius:5px;min-height:30px}
.rail-status{margin-top:13px;padding-top:10px;font-size:12px}
.rail-status strong{display:block;margin:4px 0;font-size:16px}
.rail-link{font-size:12px;font-weight:600;text-decoration:none;padding-top:10px}
.note-editor{border-radius:5px}
.paper-mini{font-size:14px}
.answer-field{font-size:15.5px}
.paper-sheet .exam-paragraph{line-height:1.38}
.modal-backdrop[hidden]{display:none!important}
@media(max-width:1180px){.layout{gap:10px}.right-rail{flex-basis:168px;padding:12px 9px}.rail-grid{gap:4px}}
@media(max-width:1000px){.right-rail{display:none}.layout{padding:0 9px}.progress-text{display:inline;font-size:11px}.paper-stack{margin:0 auto 62px}}

y"],"mark":"B","pts":0.25,"explain":"Cleft sentence: It was ... that ..."},{"t":"q","n":7,"stem":["All students should engage ___________ intellectually challenging work and should graduate on the basis of what they know and can do."],"kind":"mc","options":["at","for","to","in"],"mark":"D","pts":0.25,"explain":"Engage in something is the correct collocation."},{"t":"q","n":8,"stem":["I was ___________ to be a professional dancer, and practised for hours every day."],"kind":"mc","options":["determined","determinant","determine","determination"],"mark":"A","pts":0.25,"explain":"Determined is an adjective."},{"t":"q","n":9,"stem":["Children ____________ break the rules, or quarrel with their parents."],"kind":"mc","options":["must","mustn’t","have to","don’t have to"],"mark":"B","pts":0.25,"explain":"Mustn’t expresses prohibition."},{"t":"q","n":10,"stem":["Different people may have different ___________ towards clothing because there are no global standards."],"kind":"mc","options":["ways","behaviors","opinions","attitudes"],"mark":"D","pts":0.25,"explain":"Attitude towards something is the correct collocation."},{"t":"q","n":11,"stem":["Although the dish smelt ________, he refused to eat, saying that he was not hungry."],"kind":"mc","options":["good","well","awful","awfully"],"mark":"A","pts":0.25,"explain":"Smell is a linking verb; use the adjective good."},{"t":"q","n":12,"stem":["She just needs someone who can lend a(n) _____________ ear to her once in a while."],"kind":"mc","options":["supporting","understanding","kind","sympathetic"],"mark":"D","pts":0.25,"explain":"A sympathetic ear means someone willing to listen with understanding."},{"t":"heading","text":"PHẦN TỰ LUẬN (7.0 PTS)."},{"t":"instruction","text":"I. Supply the correct form of the given word in each of the following questions to make meaningful sentences (1.5 pt)."},{"t":"q","n":13,"stem":["The law requires equal treatment for all, ______ of race, religion, or sex. (REGARD)"],"kind":"write","options":[],"mark":"regardless","pts":0.5,"section":"word","starter":"","explain":"REGARD → regardless; regardless of means despite."},{"t":"q","n":14,"stem":["My mom was in fact quite __________________. She had always had a job and her own bank account. (DEPEND)"],"kind":"write","options":[],"mark":"independent","pts":0.5,"section":"word","starter":"","explain":"DEPEND → independent."},{"t":"q","n":15,"stem":["When my boss was out sick, I took the ___________________ to complete the monthly program report and he was pleased with my work. (INITIATE)"],"kind":"write","options":[],"mark":"initiative","pts":0.5,"section":"word","starter":"","explain":"INITIATE → initiative; take the initiative."},{"t":"instruction","text":"II. Find ONE mistake in each of the following sentences and correct it (1.5 pt)."},{"t":"q","n":16,"stem":["We ought able to find someone to do the job pretty quickly."],"kind":"write","options":[],"mark":["ought","ought to be"],"pts":0.5,"section":"mistake","starter":"","explain":"The correct structure is ought to be able to."},{"t":"q","n":17,"stem":["What makes it possible for the speaker communicating this to the hearer?"],"kind":"write","options":[],"mark":["communicating","to communicate"],"pts":0.5,"section":"mistake","starter":"","explain":"Possible for someone to do something: to communicate."},{"t":"q","n":18,"stem":["We are still waiting for Jim to make up his mind. I wish he would be more indecisive."],"kind":"write","options":[],"mark":["indecisive","decisive"],"pts":0.5,"section":"mistake","starter":"","explain":"The intended contrast requires decisive, not indecisive."},{"t":"instruction","text":"III. Reading the passage about common ways to pay for higher education carefully and answer the given questions (2.0 pts)."},{"t":"paragraph","text":"After graduating from high school, many students go on to study at a college or university. Sometimes, it is not easy to decide what to study; however, for some, choosing a major can be a pleasure. Usually, the main difficulty is figuring out how to pay for college."},{"t":"paragraph","text":"A common way to pay for school is through student loans. Students will have to provide evidence of how much money they earn, and in some cases, how much money their parents earn. A worker in the financial aid department of the college will then calculate the loan amount."},{"t":"paragraph","text":"Not all students want to take out a student loan. Instead, they might do part-time jobs to earn extra money to pay for school. Students may also work on campus during the school year. The money earned from these part-time jobs can be very helpful for paying tuition and covering the expense of living that a student loan might not fully provide for."},{"t":"paragraph","text":"An additional source of income for university students is scholarships. Students who earn higher grades are eligible to receive more scholarships. These scholarships are usually provided by governments and through donations from companies that want to assist students. A university's financial aid department can assist students looking for scholarships as well as loans."},{"t":"q","n":19,"stem":["What is the main difficulty for the students who choose to go on to college or university after graduating from high school?"],"kind":"write","options":[],"mark":"figuring out how to pay for college","pts":0.5,"section":"reading","starter":"","explain":"Paragraph 1 says the difficulty is how to pay for college."},{"t":"q","n":20,"stem":["As mentioned in the passage, what are the three ways to pay for school?"],"kind":"write","options":[],"mark":"student loans, part-time jobs, and scholarships","pts":0.5,"section":"reading","starter":"","explain":"Paragraphs 2–4 name student loans, part-time jobs and scholarships."},{"t":"q","n":21,"stem":["What will students have to do if they want to get student loans?"],"kind":"write","options":[],"mark":"provide evidence of how much money they earn, and in some cases, how much their parents earn","pts":0.5,"section":"reading","starter":"","explain":"The passage requires evidence of income, including parents’ income in some cases."},{"t":"q","n":22,"stem":["By whom are scholarships usually provided?"],"kind":"write","options":[],"mark":"governments and donations from companies","pts":0.5,"section":"reading","starter":"","explain":"The scholarships come from governments and companies."},{"t":"instruction","text":"IV. For each question, complete the new sentence so that it means the same as the given one(s) using NO MORE THAN FIVE WORDS (2.0 pts)."},{"t":"q","n":23,"stem":["When I heard that Jane had passed her exams I was really happy."],"kind":"write","options":[],"mark":"to hear that Jane had","pts":0.5,"section":"transform","starter":"I was really happy ","explain":"The cleft structure is happy to hear that Jane had passed her exams."},{"t":"q","n":24,"stem":["Daniel started Italian classes six months ago."],"kind":"write","options":[],"mark":"that Daniel started","pts":0.5,"section":"transform","starter":"It was six months ago ","explain":"It was ... ago that Daniel started ..."},{"t":"q","n":25,"stem":["Mason gets on well with other classmates."],"kind":"write","options":[],"mark":"good terms with","pts":0.5,"section":"transform","starter":"Mason is on ","explain":"The idiom is on good terms with."},{"t":"q","n":26,"stem":["Luke's first prize in the calculation competition made his parents proud."],"kind":"write","options":[],"mark":"proud of","pts":0.5,"section":"transform","starter":"Luke’s parents felt ","explain":"The adjective takes proud of."}],"total":10,"header":{"left":"SỞ GIÁO DỤC VÀ ĐÀO TẠO\nBẮC NINH","right":"ĐỀ KIỂM TRA GIỮA HỌC KỲ I\nNăm học 2021 – 2022","subject":"Môn: Tiếng Anh – Lớp 11","originalTime":"Thời gian làm bài: 45 phút (không kể thời gian giao đề)"}},{"id":"exam2022","title":"TEST 01 · MIDTERM EXAMINATION (2022–2023)","year":"2022 – 2023","minutes":60,"source":"thuvienhoclieu.com-De-thi-giua-HK1-TIENG-ANH-11-nam-2022-2023-De-1.docx","items":[{"t":"heading","text":"MULTIPLE CHOICE TEST (7.2 points)"},{"t":"instruction","text":"Choose the word whose underlined part differs from the other three in pronunciation in each of the following questions."},{"t":"q","n":1,"kind":"mc","stem":[],"mark":"A","pts":0.3,"options":["Christmas","channel","chicken","challenge"],"explain":"The correct choice follows the original answer key."},{"t":"q","n":2,"kind":"mc","stem":[],"mark":"C","pts":0.3,"options":["lend","heal","could","life"],"explain":"The correct choice follows the original answer key."},{"t":"paragraph","text":"Choose  the correct answer to each of the following questions."},{"t":"q","n":3,"kind":"mc","stem":["I was sorry that  I ___________ him."],"mark":"B","pts":0.3,"options":["have hurt","had hurt","hurt","was hurting"],"explain":"The past perfect expresses an action completed before another past event."},{"t":"q","n":4,"kind":"mc","stem":["I  __________ a little trouble with my car last week."],"mark":"B","pts":0.3,"options":["have","had","have had","had had"],"explain":"Last week is a finished past time, so use the past simple."},{"t":"q","n":5,"kind":"mc","stem":["The police made him__________the old house."],"mark":"C","pts":0.3,"options":["to leave","left","leave","leaving"],"explain":"Make + object + bare infinitive: made him leave."},{"t":"q","n":6,"kind":"mc","stem":["I don't mind __________ late, if it will help at all."],"mark":"B","pts":0.3,"options":["worked","working","to work","work"],"explain":"Mind is followed by a gerund: mind working."},{"t":"q","n":7,"kind":"mc","stem":["They ___________ through the forest when it started to rain."],"mark":"B","pts":0.3,"options":["have walked","were walking","are walking","walked"],"explain":"An ongoing past action was interrupted by a shorter action."},{"t":"q","n":8,"kind":"mc","stem":["Although he has university qualifications, he is incapable__________ doing that tricky job."],"mark":"C","pts":0.3,"options":["on","for","of","to"],"explain":"The phrase is incapable of doing something."},{"t":"q","n":9,"kind":"mc","stem":["I want __________ the film that you told me yesterday."],"mark":"A","pts":0.3,"options":["to see","seeing","see","saw"],"explain":"Want is followed by the to-infinitive."},{"t":"q","n":10,"kind":"mc","stem":["He is a ___________ person  because he is always friendly with everyone."],"mark":"A","pts":0.3,"options":["good-natured","selfish","quick-witted","honest"],"explain":"Good-natured describes a friendly personality."},{"t":"q","n":11,"kind":"mc","stem":["She was not fired, she left the company __________."],"mark":"D","pts":0.3,"options":["volunteered","volunteer","voluntary","voluntarily"],"explain":"Voluntarily is an adverb modifying left."},{"t":"q","n":12,"kind":"mc","stem":["They planned __________ to new positions in the next year."],"mark":"D","pts":0.3,"options":["appointing","to appoint","being appointed","to be appointed"],"explain":"A passive infinitive follows planned in this context."},{"t":"instruction","text":"Choose the word OPPOSITE in meaning to the underlined word in each of the following questions."},{"t":"q","n":13,"kind":"mc","stem":["I don't like that man. There is a sneaky   on his face."],"mark":"B","pts":0.3,"options":["furious","honest","humorous","friendly"],"explain":"The opposite of sneaky is honest."},{"t":"instruction","text":"Choose the word CLOSEST in meaning to the underlined word in each of the following questions."},{"t":"q","n":14,"kind":"mc","stem":["Do you know how Vietnam people celebrate Lunar New Year."],"mark":"B","pts":0.3,"options":["keep","organize","joke","blow"],"explain":"Celebrate and organise have the closest meanings in this context."},{"t":"instruction","text":"Choose the most suitable response or question to complete each of the following exchanges."},{"t":"q","n":15,"kind":"mc","stem":["Mary and Peter are talking about her driving test tomorrow","Maria : “ I’m talking my driving test tomorrow”  - Sarah : “_____________  !”"],"mark":"B","pts":0.3,"options":["I’m sorry","Good luck","Thank you","You’re welcome"],"explain":"Good luck is a suitable response before a driving test."},{"t":"q","n":16,"kind":"mc","stem":["Tom and Mary are talking about her friend","Tom: What does he look like? - Mary ”_____________”"],"mark":"D","pts":0.3,"options":["He likes playing every Saturday afternoon.","He is helpful and has a sense of humor.","Well, he is very good at Maths.","He is tall. He has got a square face."],"explain":"What does he look like? asks about appearance."},{"t":"instruction","text":"Read the following passage and choose the correct answer to each of the questions from 17 to 20."},{"t":"paragraph","text":"Generally, friendship exists for three reasons: virtue; usefulness; or pleasure. When virtue is the reason, friendship exists for the sake of friendship; where both like each other and cherish each other for some creditable values in the other's personality. You know that you would even die to swear your friendship for that person. You also know that the other would make you live than die for him/her regardless of intelligence, handsomeness, utility or the capability of giving pleasure."},{"t":"paragraph","text":"A friendship of the second kind is formed for the practical value of it. How useful so and so is to me? What can I benefit from him? Will he use his reputation and influence to fetch me a good job? Thus a person may maintain relationship for practical, professional, and political reasons. However, once we do away with the usefulness, the friendship eventually dies."},{"t":"paragraph","text":"Friendship of the third kind is formed essentially on account of the pleasure the relationship can give. He is a joker. The moment he enters, you forget all your worries. She is cute, intelligent and charming. The very notion that she is your friend makes you feel proud. The point rests here: How good is he/she in giving me pleasure physically, emotionally, mentally and materially?"},{"t":"paragraph","text":"Now to the question: Which of the three is good? The second type is good, yet since basing on utility, it falls short of longevity and quality. The third type is good too, but how long one enjoys only pleasure in life? But the first type, virtue-based friendship is fantastic for this reason: it lasts till the end of this universe."},{"t":"q","n":17,"kind":"mc","stem":["From paragraph 1, we can infer that ____."],"mark":"C","pts":0.3,"options":["There are two main motives for friendship.","You have to die in order to prove your friendship.","Real frienship does not count one person’s cleverness, appearance, utility and his/ her aptitude for creating fun","Personality is not an important factor in choosing a friend."],"explain":"Virtue-based friendship is independent of looks or practical advantage."},{"t":"q","n":18,"kind":"mc","stem":["Which of the following has the closet meaning to “do away with” in paragraph 2?"],"mark":"C","pts":0.3,"options":["ask for","kill","get rid of","escape"],"explain":"Do away with means get rid of."},{"t":"q","n":19,"kind":"mc","stem":["Which of the following is NOT mentioned in the reading passage?"],"mark":"C","pts":0.3,"options":["Friendship basing on the capacity for creating pleasure still possesses some uncertainty","Friendship usually does not last long if it is built on materialistic need","Frienship requires a lot of patience and efforts from both sides.","Virtue-based friendship's core is a friend's creditable traits in his or her personality"],"explain":"The passage does not discuss the effort required to maintain friendships."},{"t":"q","n":20,"kind":"mc","stem":["Which kind of friendship lasts forever?"],"mark":"A","pts":0.3,"options":["The first","The second","Not mentioned","The third"],"explain":"The passage identifies virtue-based friendship as the longest-lasting."},{"t":"instruction","text":"Read the following passage and choose the correct word that best fits each of the numbered blanks:"},{"t":"paragraph","text":"Volunteer Bolivia is the (21)_________ volunteer organization that combines a volunteer service learning experience with a program for an unforgettabe intercultural experience. Their variety of community volunteer positions provide you with the opportunity to make new friends, define a new career, develop new skills, and (22)_________ your skills with others. Short term volunteers are a crucial part of their program allowing you to fulfil the needs of a variety of children’s centers scattered around the region. These centers provide services (23)_________ children. Long term volunteers, are those who stay with them more than five months, speak intermediate Spanish and are specialized volunteers (24)_________ have an expertise that matches their Bolivian colleagues needs."},{"t":"q","n":21,"kind":"mc","stem":[],"mark":"B","pts":0.3,"options":["internationally","international","internation","internationale"],"explain":"International is the adjective modifying volunteer organisation."},{"t":"q","n":22,"kind":"mc","stem":[],"mark":"C","pts":0.3,"options":["take","have","share","make"],"explain":"The correct collocation is share your skills."},{"t":"q","n":23,"kind":"mc","stem":[],"mark":"C","pts":0.3,"options":["about","at","for","to"],"explain":"The source answer key selects C (for)."},{"t":"q","n":24,"kind":"mc","stem":[],"mark":"A","pts":0.3,"options":["who","whom","when","which"],"explain":"Who refers to people."},{"t":"heading","text":"WRITING TEST (2.8 points)"},{"t":"instruction","text":"Rewrite each of the sentences in such a way that it means the same as the sentence printed before it."},{"t":"q","n":25,"kind":"write","stem":["The boy remembered that they had given him a ball. . (Use “passive gerund”)"],"mark":"being given a ball","pts":0.4,"options":["","","",""],"starter":"→ The boy remembered ","explain":"Reference answer: being given a ball"},{"t":"q","n":26,"kind":"write","stem":["They left their house  and  went for a walk. . ( Use “a Present participle”)"],"mark":"Leaving their house, they went for a walk.","pts":0.4,"options":["","","",""],"starter":"→ ","explain":"Reference answer: Leaving their house, they went for a walk."},{"t":"q","n":27,"kind":"write","stem":["She decorated the classroom yesterday. (Use “notice”)"],"mark":"her decorate the classroom yesterday","pts":0.4,"options":["","","",""],"starter":"→ I noticed ","explain":"Reference answer: her decorate the classroom yesterday"},{"t":"q","n":28,"kind":"write","stem":["During his stay in Singapore, he met many good friends. (Use “While”)"],"mark":"he was staying in Singapore, he met many good friends","pts":0.4,"options":["","","",""],"starter":"→ While ","explain":"Reference answer: he was staying in Singapore, he met many good friends"},{"t":"instruction","text":"Combine the two sentences into one sentence as requested in each bracket. ."},{"t":"q","n":29,"kind":"write","stem":["Anna read the book. Then she went to bed. (Use “Perfect participle”)"],"mark":"read the book, Anna went to bed.","pts":0.4,"options":["","","",""],"starter":"→ Having ","explain":"Reference answer: read the book, Anna went to bed."},{"t":"q","n":30,"kind":"write","stem":["We answered the emails. Then we watched TV. (Use “Before”)"],"mark":"we watched TV, we had answered the emails.","pts":0.4,"options":["","","",""],"starter":"→ Before ","explain":"Reference answer: we watched TV, we had answered the emails."},{"t":"q","n":31,"kind":"write","stem":["He managed to solve this problem within an hour. It was clever of him. (Use “adj + to-inf”)"],"mark":"clever of him to manage to solve this problem within an hour.","pts":0.4,"options":["","","",""],"starter":"→ It was ","explain":"Reference answer: clever of him to manage to solve this problem within an hour."}],"total":10,"header":{"left":"KIỂM TRA GIỮA KỲ I","right":"NĂM HỌC 2022 – 2023 (ĐỀ 1)","subject":"MÔN: TIẾNG ANH – LỚP 11","originalTime":"Time limit: 60 minutes (practice setting)"}},{"id":"exam2026","title":"TEST 02 · MIDTERM REVIEW (2026–2027)","year":"2026 – 2027","minutes":60,"source":"thuvienhoclieu.com-De-on-tap-giua-HK-1-Tieng-Anh-11-nam-26-27-De-12.docx","items":[{"t":"instruction","text":"Read the following announcement and mark the letter A, B, C, or D on your answer sheet to indicate the correct option that best fits each of the numbered blanks."},{"t":"subheading","text":"MEMORIAL SERVICE FOR 731 MARTYRS"},{"t":"paragraph","text":"Ho Chi Minh City will hold a solemn memorial service at Le Thi Rieng Cultural Park to honour 731 martyrs whose remains (1) ______ over the past three months. After years of silence, they will be taken to their resting place."},{"t":"paragraph","text":"Residents are invited to come and (2) ______ tribute to the martyrs at the park. To help everyone take part with dignity, please note the following arrangements."},{"t":"paragraph","text":"Here are a few things to keep in mind:"},{"t":"paragraph","text":"❖ After the ceremony, a convoy will carry the remains to the City Martyrs' Cemetery, (3) ______ they will be laid to rest."},{"t":"paragraph","text":"❖ Those planning to join the farewell should turn (4) ______ early, since large crowds are expected."},{"t":"paragraph","text":"❖ (5) ______ you wish to bring flowers, please choose white chrysanthemums or lotus blossoms. We also kindly ask everyone to avoid (6) ______ photographs near the altar so that the atmosphere remains solemn and peaceful."},{"t":"paragraph","text":"Thank you for honouring those who gave their lives for the nation."},{"t":"credit","text":"(Adapted from VnExpress)"},{"t":"q","n":1,"kind":"mc","stem":[],"mark":"B","pts":0.25,"options":["are gathered","have been gathered","had been gathered","were gathered"],"explain":"Đáp án: B. have been gathered Giải thích: Cụm thời gian “over the past three months” kéo dài từ quá khứ đến hiện tại nên dùng hiện tại hoàn thành. “Remains” là đối tượng được tập hợp nên dùng bị động: have been gathered."},{"t":"q","n":2,"kind":"mc","stem":[],"mark":"A","pts":0.25,"options":["pay","bring","hold","raise"],"explain":"Đáp án: A. pay Giải thích: Cụm cố định là “pay tribute to somebody” = bày tỏ lòng kính trọng, tưởng niệm ai. Vì vậy “come and pay tribute” là tự nhiên và đúng nghĩa."},{"t":"q","n":3,"kind":"mc","stem":[],"mark":"B","pts":0.25,"options":["which","where","when","whose"],"explain":"Đáp án: B. where Giải thích: Danh từ đứng trước là “the City Martyrs' Cemetery” (một địa điểm). Mệnh đề quan hệ cần trạng từ quan hệ chỉ nơi chốn: “where they will be laid to rest”."},{"t":"q","n":4,"kind":"mc","stem":[],"mark":"B","pts":0.25,"options":["down","up","over","off"],"explain":"Đáp án: B. up Giải thích: Phrasal verb “turn up” = xuất hiện/đến nơi. “Turn up early” nghĩa là đến sớm vì dự kiến đông người."},{"t":"q","n":5,"kind":"mc","stem":[],"mark":"D","pts":0.25,"options":["Will","Had","Were","Should"],"explain":"Đáp án: D. Should Giải thích: Đây là đảo ngữ của câu điều kiện trang trọng: “Should you wish to bring flowers, ...” = “If you should wish / If you wish ...”."},{"t":"q","n":6,"kind":"mc","stem":[],"mark":"C","pts":0.25,"options":["take","to take","taking","taken"],"explain":"Đáp án: C. taking Giải thích: Sau “avoid” phải dùng V-ing. Do đó “avoid taking photographs” = tránh chụp ảnh."},{"t":"instruction","text":"Read the following advertisement and mark the letter A, B, C, or D on your answer sheet to indicate the correct option that best fits each of the numbered blanks."},{"t":"subheading","text":"HEART-CHARGING DRAMA NIGHT!"},{"t":"paragraph","text":"This Saturday, Lumière Café invites you to a special screening of “Take Charge of My Heart”, a romantic comedy that (7) ______ into the top three of Netflix's worldwide TV rankings since its debut."},{"t":"paragraph","text":"The story follows Baek Ho Rang, the heir of a leading corporation. Behind his flawless image lies a secret he works hard to (8) ______ from the public: he is living on an artificial heart whose battery is running low. Fortunately, he meets Na Bo Bae, who was (9) ______ by lightning as a child and still carries an electric charge in her body, just enough to keep his heart going."},{"t":"paragraph","text":"Rated 8.4/10 on MyDramaList, the series has won fans worldwide, and viewers have fallen (10) ______ for its two leads, Kim Young Kwang and Chae Soo Bin. Many of them wish they (11) ______ enough free time to binge every episode in one go. Tonight, that wish comes true!"},{"t":"paragraph","text":"You haven't seen the first episode yet, (12) ______? Don't worry, we will start from the very beginning. Doors open at 6 p.m. Seats are limited, so reserve yours by 16 October at seats@lumierecafe.com."},{"t":"credit","text":"(Adapted from various sources; Image via IMDb)"},{"t":"q","n":7,"kind":"mc","stem":[],"mark":"B","pts":0.25,"options":["climbs","has climbed","climbed","had climbed"],"explain":"Đáp án: B. has climbed Giải thích: Dấu hiệu “since its debut” yêu cầu hiện tại hoàn thành để diễn tả thành tích bắt đầu từ lúc ra mắt và còn liên hệ đến hiện tại: “has climbed into the top three”."},{"t":"q","n":8,"kind":"mc","stem":[],"mark":"C","pts":0.25,"options":["cover","announce","conceal","confess"],"explain":"Đáp án: C. conceal Giải thích: “Conceal something from somebody/the public” = che giấu điều gì khỏi ai/công chúng. Nhân vật cố giữ bí mật về trái tim nhân tạo nên “conceal” phù hợp nhất."},{"t":"q","n":9,"kind":"mc","stem":[],"mark":"C","pts":0.25,"options":["punched","kicked","struck","smacked"],"explain":"Đáp án: C. struck Giải thích: Cụm cố định: “be struck by lightning” = bị sét đánh. Vì vậy “who was struck by lightning as a child”."},{"t":"q","n":10,"kind":"mc","stem":[],"mark":"A","pts":0.25,"options":["head over heels","neck and neck","hand in hand","side by side"],"explain":"Đáp án: A. head over heels Giải thích: Cụm “fall head over heels for somebody” = mê đắm/yêu say đắm ai. Các lựa chọn còn lại không đi với “fall ... for” theo nghĩa này."},{"t":"q","n":11,"kind":"mc","stem":[],"mark":"A","pts":0.25,"options":["had","have","would have","have had"],"explain":"Đáp án: A. had Giải thích: Cấu trúc “wish” nói về điều trái với hiện tại dùng quá khứ đơn: “Many of them wish they had enough free time ...”."},{"t":"q","n":12,"kind":"mc","stem":[],"mark":"D","pts":0.25,"options":["didn’t you","haven't you","do you","have you"],"explain":"Đáp án: D. have you Giải thích: Câu chính là phủ định ở hiện tại hoàn thành: “You haven't seen ... yet”. Câu hỏi đuôi phải ở dạng khẳng định và cùng trợ động từ: “have you?”"},{"t":"instruction","text":"Mark the letter A, B, C, or D on your answer sheet to indicate the correct arrangement of the sentences to make a meaningful paragraph/letter in each of the following questions."},{"t":"q","n":13,"kind":"mc","stem":["Dear Lan,","(a) These skills are essential because children now spend many hours online and can face risks.","(b) The campaign, which runs nationwide until 10 December, teaches children how to spot online scams and cyberbullying.","(c) That is why I would be grateful if you could share it with the parents at your school.","(d) I am writing to tell you about “Không Một Mình 2026”, a campaign launched in Hanoi on 9 October to keep children safe online.","(e) Last year's season reportedly reached more than 8 million people, which shows how much families need it.","Best regards,","Minh"],"mark":"C","pts":0.25,"options":["d – a – b – e – c","b – d – a – e – c","d – b – a – e – c","d – b – a – c – e"],"explain":"Đáp án: C. d - b - a - e - c Giải thích: d mở thư và giới thiệu chiến dịch. b nói cụ thể chiến dịch dạy trẻ nhận diện lừa đảo/cyberbullying. a dùng “These skills” để nối với các kỹ năng vừa nêu. e bổ sung số liệu mùa trước để chứng minh độ cần thiết. c dùng “That is why” để đi đến lời đề nghị người nhận chia sẻ chiến dịch."},{"t":"q","n":14,"kind":"mc","stem":["(a) Thu: I agree. Watching it makes me want to spend more time with my own parents.","(b) Minh: Have you seen that viral clip of the 78-year-old woman cycling to her son's barbershop every afternoon?","(c) Minh: Probably because it shows a simple kind of love that we often forget in our busy lives.","(d) Minh: Same here. Why don't we organise a family dinner this weekend?","(e) Thu: Yes, I have. It has passed 1.9 million views, but why do you think so many people love it?"],"mark":"B","pts":0.25,"options":["b – e – a – c – d","b – e – c – a – d","e – b – c – a – d","b – c – e – a – d"],"explain":"Đáp án: B. b - e - c - a - d Giải thích: b mở đầu bằng câu hỏi về đoạn clip. e trả lời “Yes, I have” rồi hỏi vì sao clip được yêu thích. c giải thích lý do. a đồng tình và liên hệ bản thân. d kết thúc bằng đề xuất tổ chức bữa tối gia đình."},{"t":"q","n":15,"kind":"mc","stem":["(a) Lien: Wow, I'd love to know how reusing a rocket can make space travel cheaper.","(b) Quan: It’s simple. The same rocket can be launched many times, so companies save a lot of money.","(c) Quan: This year's World Space Week is about reusable rockets, and private companies are joining."],"mark":"D","pts":0.25,"options":["c – b – a","a – c – b","b – a – c","c – a – b"],"explain":"Đáp án: D. c - a - b Giải thích: c cung cấp chủ đề về tên lửa tái sử dụng. a phản hồi bằng câu hỏi “how ... can make space travel cheaper”. b trả lời trực tiếp: cùng một tên lửa được phóng nhiều lần nên tiết kiệm tiền."},{"t":"q","n":16,"kind":"mc","stem":["(a) Instead of pushing through the water, I parked my motorbike at a nearby café and waited for the rain to ease.","(b) Last week, I left my office at six o'clock just as heavy rain began to pour over Ho Chi Minh City.","(c) The experience taught me to check the weather forecast and flood warnings in the rainy season.","(d) Within minutes, the road ahead turned into a shallow river, and hundreds of vehicles were stuck in traffic.","(e) Two hours later, the water finally went down, and I rode home slowly along a safer route."],"mark":"A","pts":0.25,"options":["b – d – a – e – c","b – a – d – e – c","d – b – a – e – c","b – d – e – a – c"],"explain":"Đáp án: A. b - d - a - e - c Giải thích: b nêu sự việc mở đầu: mưa lớn bắt đầu. d mô tả hậu quả ngay sau đó: đường biến thành sông, kẹt xe. a cho biết người kể dừng lại chờ mưa giảm. e sau hai giờ nước rút và về nhà. c là bài học rút ra sau toàn bộ trải nghiệm."},{"t":"q","n":17,"kind":"mc","stem":["(a) In China, about 430,000 short films were aired in the first eight months of 2026, and over 90 per cent of them used AI.","(b) Similar worries have appeared in Viet Nam, where the Minister of Public Security warned that toxic online content may harm young people.","(c) He urged society to build “cultural immunity” so that young people can judge and choose what they watch.","(d) In recent years, artificial intelligence has made it possible to produce short films within hours and at very low cost.","(e) However, many of these productions contained harmful content, so regulators ordered about 68,000 of them to be removed."],"mark":"D","pts":0.25,"options":["d – e – a – b – c","d – a – b – e – c","a – d – e – b – c","d – a – e – b – c"],"explain":"Đáp án: D. d - a - e - b - c Giải thích: d giới thiệu xu hướng AI giúp sản xuất phim ngắn nhanh và rẻ. a đưa số liệu ở Trung Quốc. e dùng “However” để nêu mặt trái và việc gỡ bỏ nội dung độc hại. b chuyển sang Việt Nam với “Similar worries”. c dùng “He” chỉ Bộ trưởng vừa nhắc ở b và nêu lời kêu gọi."},{"t":"instruction","text":"Read the following passage and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 18 to 22."},{"t":"paragraph","text":"The line “Dad is being a dad for the first time too” from Reply 1988 has moved millions of viewers. However, (18) ______. Many young people feel that while this statement expresses love, it should not be used as an excuse for poor parenting decisions."},{"t":"paragraph","text":"In many traditional families, parents often struggle to express their feelings. They usually work hard to support the family, but they (19) ______. This creates an emotional gap between generations, making it difficult for children to share their problems with their parents."},{"t":"paragraph","text":"Instead of remaining silent, parents should learn to listen to their children without judgment, (20) ______. When parents show empathy, children are more likely to open up and seek advice when facing difficult challenges in life."},{"t":"paragraph","text":"By replacing traditional expectations with active listening, (21) ______. This understanding allows both sides to respect each other's opinions and solve personal misunderstandings more easily. Family harmony can only be achieved when parents and children make an effort to understand each other. (22) ______ to ensure a warm and happy home environment for everyone."},{"t":"credit","text":"(Adapted from various sources)"},{"t":"q","n":18,"kind":"mc","stem":[],"mark":"B","pts":0.25,"options":["audiences should mix reactions to create this quote","this quote has received mixed reactions publicly","this quote is too public to receive different reactions","audiences are publicly mixing their own reactions"],"explain":"Đáp án: B. this quote has received mixed reactions publicly Giải thích: Câu trước nói câu thoại đã làm nhiều người xúc động, câu sau bắt đầu bằng “However” rồi nói nhiều người trẻ không đồng ý dùng nó để biện minh cho cách nuôi dạy con kém. Vì vậy cần ý “câu nói này đã nhận phản ứng trái chiều”."},{"t":"q","n":19,"kind":"mc","stem":[],"mark":"A","pts":0.25,"options":["rarely spend time having conversations with their kids","are forced to talk about their emotions by their kids","avoid talking to their kids to preserve their free time","express their deep love through regular daily talks"],"explain":"Đáp án: A. rarely spend time having conversations with their kids Giải thích: Mạch ý: cha mẹ làm việc chăm chỉ để lo cho gia đình “but ...”; phần sau nói điều đó tạo khoảng cách cảm xúc. Vì vậy hợp lý nhất là họ ít dành thời gian trò chuyện với con."},{"t":"q","n":20,"kind":"mc","stem":[],"mark":"D","pts":0.25,"options":["leading to misunderstandings between family members","that prevents children from sharing their true feelings","which makes family arguments much more stressful","which creates a comfortable environment for discussions"],"explain":"Đáp án: D. which creates a comfortable environment for discussions Giải thích: Việc lắng nghe không phán xét tạo không gian an toàn để trẻ chia sẻ. Mệnh đề quan hệ “which creates ...” nối tự nhiên và phù hợp với câu sau: trẻ dễ mở lòng hơn."},{"t":"q","n":21,"kind":"mc","stem":[],"mark":"B","pts":0.25,"options":["children can avoid talking to their parents","family members can build better relationships","parents will control every decision of their children","parents can make the relationship more distant"],"explain":"Đáp án: B. family members can build better relationships Giải thích: “By replacing traditional expectations with active listening” nêu phương thức; kết quả hợp lý là các thành viên xây dựng quan hệ tốt hơn. Câu sau tiếp tục: hai bên tôn trọng nhau và giải quyết hiểu lầm dễ hơn."},{"t":"q","n":22,"kind":"mc","stem":[],"mark":"A","pts":0.25,"options":["Mutual respect and communication must be prioritized","Children should follow all traditional family principles","Parents ought to make their kids share every secret","Emotional connections can be ignored in daily routines"],"explain":"Đáp án: A. Mutual respect and communication must be prioritized Giải thích: Đoạn văn nhấn mạnh lắng nghe, thấu cảm, tôn trọng và giao tiếp hai chiều. Do đó kết luận phù hợp nhất là cần ưu tiên sự tôn trọng lẫn nhau và giao tiếp."},{"t":"instruction","text":"Read the following passage and mark the letter A, B, C, or D on your answer sheet to indicate the best answer to each of the following questions."},{"t":"paragraph","text":"Exercise is good for health, but some young people have suffered a stroke after running, cycling, or going to the gym. These cases have raised questions about the safety of physical activity. However, doctors explain that exercise itself is not the main cause of these strokes. In some cases, the real problem is an underlying health condition that the person does not know about. Such conditions may remain unseen until a serious health problem occurs."},{"t":"paragraph","text":"Several factors can increase the risk of stroke in young people. Some are health problems, such as high blood pressure and high levels of blood fat. Others are linked to daily habits. Smoking, drinking too much alcohol, staying up late, and eating too much fried food can harm the body over time. Some people also have health conditions from birth that show no clear signs. These are not always easy to notice, especially when a person feels healthy."},{"t":"paragraph","text":"Exercise can help protect health, but the way people train matters. A person who has not exercised for a long time should not start with hard workouts or sudden, intense activity. The body needs time to adjust to a new level of effort. People with health problems or a family history of blood vessel disease may need medical advice before starting a training plan. This does not mean that they must avoid exercise. It means that their health and fitness levels should guide their choices."},{"t":"paragraph","text":"Daily habits also play a part in stroke prevention. Getting enough sleep, eating balanced meals, avoiding smoking, and taking part in regular physical activity can help lower health risks. However, some health conditions need medical care, even when a person follows good habits. Young people should pay attention to their health and seek medical advice when they have concerns, rather than assuming that being young means being safe from serious illness."},{"t":"credit","text":"(Adapted from www.world-stroke.org)"},{"t":"q","n":23,"kind":"mc","stem":["The main purpose of paragraph 1 is to _____."],"mark":"D","pts":0.25,"options":["explain why young people should stop doing intense exercise","describe how doctors treat young people after a stroke","compare the health risks of running, cycling, and going to the gym","correct the idea that exercise itself is the main cause of stroke"],"explain":"Đáp án: D. correct the idea that exercise itself is the main cause of stroke Giải thích: Đoạn 1 nêu một số ca đột quỵ xảy ra sau khi tập thể dục nhưng bác sĩ giải thích bản thân việc tập luyện không phải nguyên nhân chính; vấn đề có thể là bệnh nền. Mục đích chính là sửa hiểu lầm này."},{"t":"q","n":24,"kind":"mc","stem":["The word underlying in paragraph 1 is CLOSEST in meaning to _____."],"mark":"A","pts":0.25,"options":["hidden","common","serious","temporary"],"explain":"Đáp án: A. hidden Giải thích: “Underlying health condition” là tình trạng bệnh tiềm ẩn, có sẵn nhưng chưa biểu hiện rõ. “Hidden” gần nghĩa nhất."},{"t":"q","n":25,"kind":"mc","stem":["The word These in paragraph 2 refers to _____."],"mark":"A","pts":0.25,"options":["health problems","training plans","blood vessels","the strokes"],"explain":"Đáp án: A. health problems Giải thích: “These” đứng ngay sau “Some people also have health conditions from birth that show no clear signs.” Vì vậy “These” chỉ các vấn đề/tình trạng sức khỏe bẩm sinh khó nhận biết."},{"t":"q","n":26,"kind":"mc","stem":["Which of the following best paraphrases the underlined idea in paragraph 3?"],"mark":"B","pts":0.25,"options":["The body can handle hard exercise as soon as a person begins training.","The body requires time to get used to a higher level of physical activity.","The body becomes stronger only when people exercise at a high level.","The body needs less exercise when a person has trained for a long time."],"explain":"Đáp án: B. The body requires time to get used to a higher level of physical activity. Giải thích: Câu gạch chân “The body needs time to adjust to a new level of effort” nghĩa là cơ thể cần thời gian thích nghi với mức vận động cao hơn. B diễn đạt đúng nhất."},{"t":"q","n":27,"kind":"mc","stem":["The word intense in paragraph 3 is OPPOSITE in meaning to _____."],"mark":"C","pts":0.25,"options":["severe","extreme","gentle","sudden"],"explain":"Đáp án: C. gentle Giải thích: “Intense” = mạnh, dữ dội, cường độ cao. Từ trái nghĩa là “gentle” = nhẹ nhàng."},{"t":"q","n":28,"kind":"mc","stem":["Which of the following statements would the writer NOT agree with?"],"mark":"D","pts":0.25,"options":["Young people can have health conditions without showing clear signs.","Regular exercise can lower health risks, but it cannot remove them all.","People with health conditions may need medical advice before exercising.","Youngsters who feel healthy do not need to worry about the risk of stroke."],"explain":"Đáp án: D. Youngsters who feel healthy do not need to worry about the risk of stroke. Giải thích: Tác giả khẳng định người trẻ dù cảm thấy khỏe vẫn có thể có bệnh nền không biểu hiện rõ và nên chú ý đến sức khỏe. Vì vậy tác giả sẽ không đồng ý với D."},{"t":"q","n":29,"kind":"mc","stem":["In which paragraph does the writer discuss the need to seek medical advice when exercising?"],"mark":"C","pts":0.25,"options":["Paragraph 1","Paragraph 2","Paragraph 3","Paragraph 4"],"explain":"Đáp án: C. Paragraph 3 Giải thích: Đoạn 3 nói người có vấn đề sức khỏe hoặc tiền sử gia đình về bệnh mạch máu “may need medical advice before starting a training plan”."},{"t":"q","n":30,"kind":"mc","stem":["In which paragraph does the writer discuss elements causing strokes?"],"mark":"B","pts":0.25,"options":["Paragraph 1","Paragraph 2","Paragraph 3","Paragraph 4"],"explain":"Đáp án: B. Paragraph 2 Giải thích: Đoạn 2 liệt kê các yếu tố làm tăng nguy cơ đột quỵ: huyết áp cao, mỡ máu cao, hút thuốc, uống nhiều rượu, thức khuya, ăn nhiều đồ chiên và bệnh bẩm sinh."},{"t":"instruction","text":"Read the following passage and mark the letter A, B, C, or D on your answer sheet to indicate the best answer to each of the following questions."},{"t":"paragraph","text":"Urban dwellers once defined longevity by the total number of years they lived. Success meant working late, taking on heavy stress, and trading personal well-being for financial stability. Today, young professionals are abandoning this trade-off. Rather than focusing on living longer, they choose to focus on daily vitality and long-term health. As a result, traditional measures of career achievement are changing across major cities."},{"t":"paragraph","text":"This movement grows directly out of the harsh conditions found in modern workplaces. Constant connectivity and long hours behind a desk have created an epidemic of fatigue. High earners are coming to realize that a substantial salary means little when it goes toward medical care for stress-related illnesses. Instead of attempting life changes, many turn to micro-habits. Simple practices like taking a brief walk or keeping a fixed bedtime allow individuals to regain control without interrupting their daily routines."},{"t":"paragraph","text":"This emphasis on wellness is also reshaping how citizens choose their living spaces. [I] Young homebuyers now prioritize neighborhood green spaces over indoor luxury features. [II] They search for homes near public parks and local produce markets. [III] Seeing this shift, real estate firms have started designing properties around healthier environments. [IV] City growth is finally beginning to align with human needs."},{"t":"paragraph","text":"Ultimately, this ongoing shift reflects a fundamental change in personal values. City living is no longer just about surviving a demanding career path. By embedding healthy habits into their schedules, young adults are establishing a workable model for modern life. If governments support them with better green infrastructure, future cities will become places where citizens can thrive."},{"t":"credit","text":"(Adapted from www.oecd.org)"},{"t":"q","n":31,"kind":"mc","stem":["What point does the author make in paragraph 1?"],"mark":"B","pts":0.25,"options":["City dwellers can achieve financial stability by sacrificing their health.","Young urban adults are rethinking the idea of success through health.","Traditional career goals no longer appeal to any young professionals.","Living a long life naturally leads to better mental and physical health."],"explain":"Đáp án: B. Young urban adults are rethinking the idea of success through health. Giải thích: Đoạn 1 đối lập quan niệm cũ về thành công (làm nhiều, chịu áp lực, đánh đổi sức khỏe) với người trẻ hiện nay ưu tiên sức sống hằng ngày và sức khỏe dài hạn. Vì vậy B là ý chính."},{"t":"q","n":32,"kind":"mc","stem":["What conclusion can be drawn from paragraph 2?"],"mark":"C","pts":0.25,"options":["Lifestyle adjustments are essential to eliminate urban burnout.","Fatigue among professionals is often the result of low salaries.","Young people are replacing big life changes with simple habits.","Office routines force workers to spend money on medical care."],"explain":"Đáp án: C. Young people are replacing big life changes with simple habits. Giải thích: Đoạn 2 nói nhiều người “Instead of attempting life changes, many turn to micro-habits”, ví dụ đi bộ ngắn hoặc ngủ đúng giờ. Đây chính là C."},{"t":"q","n":33,"kind":"mc","stem":["The word measures in the context of paragraph 1 most likely means _____."],"mark":"A","pts":0.25,"options":["standards","actions","behaviours","solutions"],"explain":"Đáp án: A. standards Giải thích: Trong cụm “traditional measures of career achievement”, “measures” mang nghĩa tiêu chí/thước đo để đánh giá thành tựu nghề nghiệp, gần nhất với “standards”."},{"t":"q","n":34,"kind":"mc","stem":["Where in paragraph 3 does the following sentence best fit?","“Those facilities enable residents to stay active outdoors without leaving their neighborhoods too far.”"],"mark":"C","pts":0.25,"options":["[I]","[II]","[III]","[IV]"],"explain":"Đáp án: C. [III] Giải thích: Câu thêm bắt đầu bằng “These facilities”, nên phải đứng sau câu vừa nêu rõ các cơ sở/tiện ích là “public parks and local produce markets”. Vị trí phù hợp nhất là [III], trước câu “Seeing this shift...”."},{"t":"q","n":35,"kind":"mc","stem":["Which of the following best captures the writer’s main point in paragraph 3?"],"mark":"B","pts":0.25,"options":["Property developers are forcing city residents to adopt wellness habits.","Changing personal wellness preferences are shaping new trends in cities.","Modern residential areas must have luxury amenities to attract buyers.","Local markets are replacing traditional retail outlets in urban areas."],"explain":"Đáp án: B. Changing personal wellness preferences are shaping new trends in cities. Giải thích: Đoạn 3 cho thấy người mua nhà ưu tiên không gian xanh, công viên và chợ thực phẩm địa phương; sau đó doanh nghiệp bất động sản điều chỉnh thiết kế theo xu hướng đó. Vì vậy B bao quát nhất."},{"t":"q","n":36,"kind":"mc","stem":["The word They in paragraph 3 refers to _____."],"mark":"D","pts":0.25,"options":["Luxury features","Green spaces","Living spaces","Homebuyers"],"explain":"Đáp án: D. Homebuyers Giải thích: “They search for homes ...” quay lại chủ ngữ ở câu trước là “Young homebuyers”."},{"t":"q","n":37,"kind":"mc","stem":["Which of the following CANNOT be inferred from paragraph 4?"],"mark":"A","pts":0.25,"options":["Urban living used to focus on immediate work achievements and survival.","Government investments in green environments will help residents live better.","Combining health habits with daily routines helps build a more sustainable lifestyle.","People’s core priorities regarding city life are undergoing a transformation."],"explain":"Đáp án: A. Urban living used to focus on immediate work achievements and survival. Giải thích: Đoạn 4 nói thành phố “is no longer just about surviving a demanding career path”, nhấn mạnh sự thay đổi giá trị, thói quen lành mạnh và hạ tầng xanh. Ý “immediate work achievements” không được nêu hoặc suy ra rõ từ riêng đoạn 4, nên A là lựa chọn không thể suy ra chắc chắn."},{"t":"q","n":38,"kind":"mc","stem":["Which of the following is TRUE, according to the passage?"],"mark":"D","pts":0.25,"options":["Micro-habits require individuals to dedicate massive time and effort each day.","City dwellers in the past were careless about their physical and emotional health.","Real estate companies started green movements before citizens changed their habits.","High salaries lose their appeal when people suffer from constant stress and fatigue."],"explain":"Đáp án: D. High salaries lose their appeal when people suffer from constant stress and fatigue. Giải thích: Đoạn 2 nói người thu nhập cao nhận ra mức lương lớn “means little” nếu phải dùng để chữa các bệnh do stress. D diễn đạt đúng ý này."},{"t":"q","n":39,"kind":"mc","stem":["Which of the following can be inferred from the passage?"],"mark":"A","pts":0.25,"options":["Environmental factors in cities influence the change in healthy living choices.","Micro-habits are effective because they promise immediate improvements.","People living in walkable zones will not experience workplace burnout.","The desire for career advancement has been eliminated in modern cities."],"explain":"Đáp án: A. Environmental factors in cities influence the change in healthy living choices. Giải thích: Người dân ưu tiên nhà gần công viên, chợ thực phẩm địa phương và chính quyền được khuyến khích đầu tư hạ tầng xanh. Có thể suy ra môi trường đô thị ảnh hưởng đến lựa chọn sống khỏe."},{"t":"q","n":40,"kind":"mc","stem":["Which of the following would be the best title for the passage?"],"mark":"C","pts":0.25,"options":["The High Cost of Modern Urban Living","Urban Life: From Luxury to Simplicity","Redefining City Life to Live Better","How Green Spaces Solve Burnout"],"explain":"Đáp án: C. Redefining City Life to Live Better Giải thích: Toàn bài nói sự chuyển dịch từ chạy theo thành tựu nghề nghiệp và chịu đựng căng thẳng sang ưu tiên sức khỏe, micro-habits, môi trường sống xanh và thành phố hỗ trợ con người. Tiêu đề C bao quát nhất."}],"total":10,"header":{"left":"ĐỀ 12","right":"ĐỀ ÔN TẬP GIỮA HỌC KỲ I","subject":"NĂM HỌC 2026–2027 · MÔN: TIẾNG ANH 11","originalTime":"Time limit: 60 minutes (practice setting)"}},{"id":"practice1","title":"Đề luyện 1 · Healthy Life","year":"2026","minutes":45,"source":"https://loigiaihay.com/de-so-1-de-kiem-tra-giua-ki-1-tieng-anh-11-moi-a83944.html","external":true,"originalPractice":true,"total":10,"header":{"left":"GRADE 11 · MIDTERM PRACTICE","right":"PRACTICE PAPER 01\nSCHOOL YEAR 2026–2027","subject":"ENGLISH · GRADE 11","originalTime":"Time allowed: 45 minutes"},"items":[{"t":"heading","text":"PART I. MULTIPLE CHOICE (6.0 POINTS)"},{"t":"instruction","text":"Choose the correct answer A, B, C or D for each question."},{"t":"q","kind":"mc","stem":["Choose the word whose -ed ending is pronounced differently."],"options":["played","cleaned","needed","stayed"],"mark":"C","pts":0.25,"explain":"The ending -ed in needed is /ɪd/; the others end in /d/.","under":"ed","n":1},{"t":"q","kind":"mc","stem":["Choose the word whose -s ending is pronounced differently."],"options":["walks","helps","runs","sleeps"],"mark":"C","pts":0.25,"explain":"Runs ends with /z/, whereas the others end with /s/.","under":"s","n":2},{"t":"q","kind":"mc","stem":["Choose the word whose underlined vowel sound is different."],"options":["meal","seat","bread","team"],"mark":"C","pts":0.25,"explain":"Bread contains /e/, whereas the others contain /iː/.","n":3},{"t":"instruction","text":"Choose the word with a different main stress pattern."},{"t":"q","kind":"mc","stem":["Which word has a different main stress pattern?"],"options":["exercise","regular","vitamin","prevent"],"mark":"D","pts":0.25,"explain":"Prevent is stressed on the second syllable; the others on the first.","n":4},{"t":"q","kind":"mc","stem":["Which word has a different main stress pattern?"],"options":["important","successful","physical","effective"],"mark":"C","pts":0.25,"explain":"Physical has first-syllable stress; the others have second-syllable stress.","n":5},{"t":"instruction","text":"Choose the best answer to complete each sentence."},{"t":"q","kind":"mc","stem":["You should ______ enough water when you exercise."],"options":["drink","drinking","drank","drinks"],"mark":"A","pts":0.25,"explain":"Should is followed by the base form of the verb.","n":6},{"t":"q","kind":"mc","stem":["Mai has avoided sugary drinks ______ January."],"options":["for","since","during","from"],"mark":"B","pts":0.25,"explain":"Since introduces a starting point in the present perfect.","n":7},{"t":"q","kind":"mc","stem":["Regular physical activity can ______ your mood."],"options":["improve","improvement","improving","improved"],"mark":"A","pts":0.25,"explain":"A modal verb is followed by a bare infinitive.","n":8},{"t":"q","kind":"mc","stem":["The doctor advised me ______ up late."],"options":["not stay","not staying","not to stay","to not staying"],"mark":"C","pts":0.25,"explain":"Advise somebody not to do something.","n":9},{"t":"q","kind":"mc","stem":["My grandfather ______ morning exercises every day."],"options":["makes","does","takes","gets"],"mark":"B","pts":0.25,"explain":"The natural collocation is do morning exercises.","n":10},{"t":"q","kind":"mc","stem":["Since last summer, Linh ______ a healthier diet."],"options":["followed","has followed","is following","follows"],"mark":"B","pts":0.25,"explain":"The present perfect connects an action that began in the past with the present.","n":11},{"t":"q","kind":"mc","stem":["We should eat ______ vegetables and less processed food."],"options":["more","many","most","much"],"mark":"A","pts":0.25,"explain":"More is the comparative determiner used here.","n":12},{"t":"q","kind":"mc","stem":["Too little sleep may have a negative ______ on memory."],"options":["affect","effect","effective","affects"],"mark":"B","pts":0.25,"explain":"The noun effect follows a negative.","n":13},{"t":"q","kind":"mc","stem":["The swimming pool is closed, ______ we will go cycling instead."],"options":["because","although","so","unless"],"mark":"C","pts":0.25,"explain":"So introduces the result.","n":14},{"t":"q","kind":"mc","stem":["This walking route is ______ than the old one."],"options":["safe","safer","safest","safely"],"mark":"B","pts":0.25,"explain":"The comparative form with than is safer.","n":15},{"t":"q","kind":"mc","stem":["If you feel dizzy while running, you ______ stop and rest."],"options":["must","would","might have","used to"],"mark":"A","pts":0.25,"explain":"Must expresses a strong obligation in a safety situation.","n":16},{"t":"instruction","text":"Read the passage and choose the best word for each numbered blank."},{"t":"paragraph","text":"Students at Green Hill School have started a wellness club. Every Friday, members (17) ______ short walks after class. They also learn how to prepare simple meals. The club encourages students to (18) ______ a regular bedtime. Instead of giving strict rules, the teachers help students make (19) ______ changes that are easy to maintain. Members say they now feel more (20) ______ during morning lessons."},{"t":"q","kind":"mc","stem":[],"options":["take","make","do","keep"],"mark":"A","pts":0.25,"explain":"Take walks is the correct collocation.","n":17},{"t":"q","kind":"mc","stem":[],"options":["keeping","kept","keep","keeps"],"mark":"C","pts":0.25,"explain":"To keep is a bare infinitive after to.","n":18},{"t":"q","kind":"mc","stem":[],"options":["small","heavy","deep","wide"],"mark":"A","pts":0.25,"explain":"Small changes are gradual and manageable.","n":19},{"t":"q","kind":"mc","stem":[],"options":["energy","energetic","energetically","energise"],"mark":"B","pts":0.25,"explain":"Feel is followed by the adjective energetic.","n":20},{"t":"instruction","text":"Read the following passage and answer the questions."},{"t":"paragraph","text":"A group of teenagers decided to walk to school three mornings a week. At first, several members worried that they would arrive tired. After a month, most said they felt more awake in the first lesson. The group chose well-lit streets and walked together in pairs. They never crossed busy roads without using designated crossings. Parents noticed that their children spent less time looking at phones on the way to school. The students did not claim that walking could replace every form of exercise. They simply found it an enjoyable way to make movement part of their daily routine."},{"t":"q","kind":"mc","stem":["What is the passage mainly about?"],"options":["A group making walking a safe daily habit","A competition to run faster","A school banning mobile phones","Parents driving children to class"],"mark":"A","pts":0.25,"explain":"The passage describes students choosing regular walks and safe routes.","n":21},{"t":"q","kind":"mc","stem":["How did most group members feel after a month?"],"options":["More worried","More awake","More sleepy","Less confident"],"mark":"B","pts":0.25,"explain":"They reported feeling more awake in their first lesson.","n":22},{"t":"q","kind":"mc","stem":["Which safety measure did students use?"],"options":["Walking alone at night","Crossing roads anywhere","Choosing well-lit streets","Using phones at crossings"],"mark":"C","pts":0.25,"explain":"They chose well-lit streets and used proper crossings.","n":23},{"t":"q","kind":"mc","stem":["What can be inferred about the programme?"],"options":["It was expensive","It was difficult to maintain","It banned all other exercise","It fitted into everyday life"],"mark":"D","pts":0.25,"explain":"Students integrated movement into an existing school commute.","n":24},{"t":"heading","text":"PART II. WRITING (4.0 POINTS)"},{"t":"instruction","text":"Write the correct word or complete each sentence as instructed."},{"t":"q","kind":"write","stem":["Complete the sentence using ONE word: Fresh fruit is often a healthy ______ between meals."],"options":[],"starter":"","mark":"snack","pts":1.0,"section":"word","explain":"Snack is a suitable noun here.","n":25},{"t":"q","kind":"write","stem":["Complete with the correct form of HEALTH: Regular sleep supports a ______ lifestyle."],"options":[],"starter":"","mark":"healthy","pts":1.0,"section":"word","explain":"The adjective healthy modifies lifestyle.","n":26},{"t":"q","kind":"write","stem":["Rewrite: I started exercising regularly three months ago. Use the present perfect."],"options":[],"starter":"I have ","mark":"exercised regularly for three months","pts":1.0,"section":"transform","explain":"Present perfect + for + a period of time.","n":27},{"t":"q","kind":"write","stem":["Rewrite: It is advisable to drink more water. Use SHOULD."],"options":[],"starter":"You ","mark":"should drink more water","pts":1.0,"section":"transform","explain":"Should + bare infinitive.","n":28}]},{"id":"practice2","title":"Đề luyện 2 · Family & Generations","year":"2026","minutes":45,"source":"https://loigiaihay.com/de-so-2-de-kiem-tra-giua-ki-1-tieng-anh-11-moi-a83863.html","external":true,"originalPractice":true,"total":10,"header":{"left":"GRADE 11 · MIDTERM PRACTICE","right":"PRACTICE PAPER 02\nSCHOOL YEAR 2026–2027","subject":"ENGLISH · GRADE 11","originalTime":"Time allowed: 45 minutes"},"items":[{"t":"heading","text":"PART I. MULTIPLE CHOICE (6.0 POINTS)"},{"t":"instruction","text":"Choose the correct answer A, B, C or D for each question."},{"t":"q","kind":"mc","stem":["Choose the word whose -s ending is pronounced differently."],"options":["likes","cooks","plays","helps"],"mark":"C","pts":0.25,"explain":"Plays ends in /z/; the others in /s/.","under":"s","n":1},{"t":"q","kind":"mc","stem":["Choose the word whose -ed ending is pronounced differently."],"options":["visited","wanted","helped","needed"],"mark":"C","pts":0.25,"explain":"Helped ends in /t/; the others in /ɪd/.","under":"ed","n":2},{"t":"q","kind":"mc","stem":["Choose the word whose vowel sound differs."],"options":["head","bread","seat","said"],"mark":"C","pts":0.25,"explain":"Seat has /iː/; the others have /e/.","n":3},{"t":"instruction","text":"Choose the word with a different main stress pattern."},{"t":"q","kind":"mc","stem":["Choose the word with a different stress pattern."],"options":["grandparent","relative","respectful","family"],"mark":"C","pts":0.25,"explain":"Respectful has stress on the second syllable.","n":4},{"t":"q","kind":"mc","stem":["Choose the word with a different stress pattern."],"options":["opinion","tradition","solution","argument"],"mark":"D","pts":0.25,"explain":"Argument is stressed on the first syllable.","n":5},{"t":"instruction","text":"Choose the best answer to complete each sentence."},{"t":"q","kind":"mc","stem":["A family that includes grandparents, parents and children is a(n) ______ family."],"options":["nuclear","extended","single","empty"],"mark":"B","pts":0.25,"explain":"An extended family includes relatives from more than two generations.","n":6},{"t":"q","kind":"mc","stem":["My parents always encourage me ______ my opinions politely."],"options":["share","sharing","to share","shared"],"mark":"C","pts":0.25,"explain":"Encourage somebody to do something.","n":7},{"t":"q","kind":"mc","stem":["The children ______ quietly when their grandparents arrived."],"options":["studied","were studying","have studied","study"],"mark":"B","pts":0.25,"explain":"Past continuous describes a background action interrupted by another event.","n":8},{"t":"q","kind":"mc","stem":["We sometimes disagree, ______ we still respect one another."],"options":["but","because","unless","so that"],"mark":"A","pts":0.25,"explain":"But contrasts two ideas.","n":9},{"t":"q","kind":"mc","stem":["Teenagers should learn to make some decisions ______."],"options":["themselves","ourselves","itself","herself"],"mark":"A","pts":0.25,"explain":"The reflexive pronoun for teenagers is themselves.","n":10},{"t":"q","kind":"mc","stem":["It is important ______ carefully when older family members speak."],"options":["listen","to listen","listening","listened"],"mark":"B","pts":0.25,"explain":"The construction is It is + adjective + to-infinitive.","n":11},{"t":"q","kind":"mc","stem":["My sister is ______ to manage her monthly allowance."],"options":["responsible enough","enough responsible","responsibly enough","responsible too"],"mark":"A","pts":0.25,"explain":"Adjective + enough + to-infinitive.","n":12},{"t":"q","kind":"mc","stem":["Dad asked me ______ the kitchen after dinner."],"options":["tidy","tidying","to tidy","tidied"],"mark":"C","pts":0.25,"explain":"Ask somebody to do something.","n":13},{"t":"q","kind":"mc","stem":["Neither my brother nor I ______ interested in arguing about small matters."],"options":["is","am","are","be"],"mark":"B","pts":0.25,"explain":"With neither...nor, the verb agrees with the closer subject I.","n":14},{"t":"q","kind":"mc","stem":["Mutual ______ makes family conversations more productive."],"options":["respect","respectful","respectfully","respected"],"mark":"A","pts":0.25,"explain":"A noun is needed as the subject.","n":15},{"t":"q","kind":"mc","stem":["You ______ interrupt someone who is sharing a concern."],"options":["should","should not","must","have to"],"mark":"B","pts":0.25,"explain":"Should not gives advice against a discourteous action.","n":16},{"t":"instruction","text":"Read the passage and choose the best word for each numbered blank."},{"t":"paragraph","text":"When several generations share a home, everyone has different habits. To avoid arguments, the Nguyen family holds a short meeting every Sunday. Everyone is invited to (17) ______ an opinion. The younger children are encouraged to listen (18) ______ while others speak. The family also agrees on shared responsibilities, such (19) ______ cleaning the living room. Over time, these small habits have helped them build (20) ______ trust."},{"t":"q","kind":"mc","stem":[],"options":["express","reach","borrow","raise"],"mark":"A","pts":0.25,"explain":"Express an opinion is the natural phrase.","n":17},{"t":"q","kind":"mc","stem":[],"options":["careful","carefully","care","careless"],"mark":"B","pts":0.25,"explain":"The adverb carefully modifies listen.","n":18},{"t":"q","kind":"mc","stem":[],"options":["for","like","as","with"],"mark":"C","pts":0.25,"explain":"Such as introduces examples.","n":19},{"t":"q","kind":"mc","stem":[],"options":["mutual","daily","weak","distant"],"mark":"A","pts":0.25,"explain":"Mutual trust means trust shared between people.","n":20},{"t":"instruction","text":"Read the following passage and answer the questions."},{"t":"paragraph","text":"In a small town, Thu lives with her parents and grandmother. Her grandmother knows how to repair old clothes, and Thu enjoys learning these skills. In return, Thu shows her grandmother how to make video calls to relatives abroad. They often disagree about the amount of time Thu spends online, but both try to explain their reasons calmly. Last month they worked together to organise a family celebration. Thu designed digital invitations, while her grandmother prepared a traditional meal. Their relatives praised the event because it brought old and new customs together. Thu believes that understanding different generations begins with patience."},{"t":"q","kind":"mc","stem":["Which skill does Thu learn from her grandmother?"],"options":["Editing videos","Repairing clothes","Programming apps","Playing the piano"],"mark":"B","pts":0.25,"explain":"Her grandmother teaches her to repair clothes.","n":21},{"t":"q","kind":"mc","stem":["What does Thu teach her grandmother?"],"options":["Using video calls","Cooking a traditional meal","Driving","Writing invitations by hand"],"mark":"A","pts":0.25,"explain":"Thu demonstrates how to make video calls.","n":22},{"t":"q","kind":"mc","stem":["How do they deal with disagreements?"],"options":["They avoid one another","They ask neighbours to decide","They explain their reasons calmly","They stop speaking"],"mark":"C","pts":0.25,"explain":"The passage explicitly states that both explain their reasons calmly.","n":23},{"t":"q","kind":"mc","stem":["What is the message of the passage?"],"options":["Technology always creates conflict","Traditional customs should disappear","Young people cannot learn from elders","Different generations can learn from each other"],"mark":"D","pts":0.25,"explain":"The story highlights reciprocal learning and patience.","n":24},{"t":"heading","text":"PART II. WRITING (4.0 POINTS)"},{"t":"instruction","text":"Write the correct word or complete each sentence as instructed."},{"t":"q","kind":"write","stem":["Complete the sentence: We should show ______ for different family traditions."],"options":[],"starter":"","mark":"respect","pts":1.0,"section":"word","explain":"The correct noun is respect.","n":25},{"t":"q","kind":"write","stem":["Complete with the correct form of INDEPENDENT: Teens need some ______ in making choices."],"options":[],"starter":"","mark":"independence","pts":1.0,"section":"word","explain":"Independence is the noun meaning freedom to make decisions.","n":26},{"t":"q","kind":"write","stem":["Rewrite: My parents allow me to make my own decisions. Use LET."],"options":[],"starter":"My parents let me ","mark":"make my own decisions","pts":1.0,"section":"transform","explain":"Let + object + bare infinitive.","n":27},{"t":"q","kind":"write","stem":["Rewrite: It is necessary for us to listen carefully. Use MUST."],"options":[],"starter":"We ","mark":"must listen carefully","pts":1.0,"section":"transform","explain":"Must + bare infinitive.","n":28}]},{"id":"practice3","title":"Đề luyện 3 · Independence & Skills","year":"2026","minutes":45,"source":"https://loigiaihay.com/de-so-3-de-kiem-tra-giua-ki-1-tieng-anh-11-moi-a83865.html","external":true,"originalPractice":true,"total":10,"header":{"left":"GRADE 11 · MIDTERM PRACTICE","right":"PRACTICE PAPER 03\nSCHOOL YEAR 2026–2027","subject":"ENGLISH · GRADE 11","originalTime":"Time allowed: 45 minutes"},"items":[{"t":"heading","text":"PART I. MULTIPLE CHOICE (6.0 POINTS)"},{"t":"instruction","text":"Choose the correct answer A, B, C or D for each question."},{"t":"q","kind":"mc","stem":["Choose the word whose -ed ending is pronounced differently."],"options":["planned","organised","worked","learned"],"mark":"C","pts":0.25,"explain":"Worked has /t/ and the other endings are /d/.","under":"ed","n":1},{"t":"q","kind":"mc","stem":["Choose the word whose -s ending is pronounced differently."],"options":["tasks","skills","books","steps"],"mark":"B","pts":0.25,"explain":"Skills ends /z/ while the others end /s/.","under":"s","n":2},{"t":"q","kind":"mc","stem":["Choose the word whose vowel is pronounced differently."],"options":["coach","road","goal","broad"],"mark":"D","pts":0.25,"explain":"Broad has /ɔː/; the others use /əʊ/.","n":3},{"t":"instruction","text":"Choose the word with a different main stress pattern."},{"t":"q","kind":"mc","stem":["Choose the word with different primary stress."],"options":["decisive","responsible","confident","mature"],"mark":"C","pts":0.25,"explain":"Confident has first-syllable stress.","n":4},{"t":"q","kind":"mc","stem":["Choose the word with different primary stress."],"options":["organise","practise","prepare","manage"],"mark":"C","pts":0.25,"explain":"Prepare is stressed on the second syllable.","n":5},{"t":"instruction","text":"Choose the best answer to complete each sentence."},{"t":"q","kind":"mc","stem":["A weekly budget can help teenagers ______ their spending."],"options":["manage","managing","managed","management"],"mark":"A","pts":0.25,"explain":"Help + object + bare infinitive.","n":6},{"t":"q","kind":"mc","stem":["I learned to cook when my parents ______ me a simple recipe."],"options":["give","gave","have given","giving"],"mark":"B","pts":0.25,"explain":"A completed past action takes past simple.","n":7},{"t":"q","kind":"mc","stem":["Students should take ______ for keeping their classrooms tidy."],"options":["responsible","responsibly","responsibility","response"],"mark":"C","pts":0.25,"explain":"Take responsibility for is a fixed expression.","n":8},{"t":"q","kind":"mc","stem":["My teacher encouraged me to work more ______."],"options":["independence","independent","independently","depend"],"mark":"C","pts":0.25,"explain":"An adverb modifies work.","n":9},{"t":"q","kind":"mc","stem":["If you practise regularly, you ______ more confident."],"options":["become","will become","became","had become"],"mark":"B","pts":0.25,"explain":"First conditional: If + present, will + infinitive.","n":10},{"t":"q","kind":"mc","stem":["I can now solve this problem ______ asking for help."],"options":["without","because","rather","besides"],"mark":"A","pts":0.25,"explain":"Without + gerund expresses not needing something.","n":11},{"t":"q","kind":"mc","stem":["Hoa ______ her schedule before she started the new course."],"options":["had planned","has planned","plans","was planning"],"mark":"A","pts":0.25,"explain":"Past perfect shows the planning preceded the start.","n":12},{"t":"q","kind":"mc","stem":["The training programme aims ______ communication skills."],"options":["improve","improved","improving","to improve"],"mark":"D","pts":0.25,"explain":"Aim to do something.","n":13},{"t":"q","kind":"mc","stem":["I have ______ finished my homework, so I can go out now."],"options":["yet","already","since","for"],"mark":"B","pts":0.25,"explain":"Already is typical in affirmative present perfect statements.","n":14},{"t":"q","kind":"mc","stem":["Would you mind ______ me how to use this app?"],"options":["show","to show","showing","shown"],"mark":"C","pts":0.25,"explain":"Mind is followed by an -ing form.","n":15},{"t":"q","kind":"mc","stem":["Learning from mistakes is an important part ______ growing up."],"options":["in","of","to","at"],"mark":"B","pts":0.25,"explain":"Part of is the correct preposition.","n":16},{"t":"instruction","text":"Read the passage and choose the best word for each numbered blank."},{"t":"paragraph","text":"A group of eleventh graders set themselves a thirty-day challenge. Their goal was to become more independent. Each participant had to (17) ______ a simple weekly budget, prepare one meal, and keep a study timetable. At the beginning, some students found these tasks (18) ______. However, the group met once a week to share useful tips. By the end, many students reported greater (19) ______ in handling everyday situations. The teachers said the programme was successful (20) ______ it gave students real responsibilities."},{"t":"q","kind":"mc","stem":[],"options":["create","contain","receive","borrow"],"mark":"A","pts":0.25,"explain":"Create a budget is natural and meaningful.","n":17},{"t":"q","kind":"mc","stem":[],"options":["challenge","challenging","challenged","challenges"],"mark":"B","pts":0.25,"explain":"Found the tasks challenging requires an adjective.","n":18},{"t":"q","kind":"mc","stem":[],"options":["confident","confidence","confidently","confide"],"mark":"B","pts":0.25,"explain":"The noun confidence follows greater.","n":19},{"t":"q","kind":"mc","stem":[],"options":["although","unless","because","until"],"mark":"C","pts":0.25,"explain":"Because introduces the reason.","n":20},{"t":"instruction","text":"Read the following passage and answer the questions."},{"t":"paragraph","text":"When An began a summer volunteer project, she expected to receive detailed instructions for every task. Instead, the team leader asked each volunteer to choose a suitable activity and plan how to complete it. An decided to design posters encouraging local residents to save water. She made several mistakes in her first draft, but her teammates offered suggestions rather than doing the work for her. After revising the posters, she presented them at a community meeting. An felt nervous at first, then proud when people asked thoughtful questions. She later realised that independence did not mean refusing help; it meant taking responsibility while knowing when to ask for advice."},{"t":"q","kind":"mc","stem":["What did An choose to create?"],"options":["Posters about saving water","A school timetable","A sports uniform","A budget for a trip"],"mark":"A","pts":0.25,"explain":"She designed water-saving posters.","n":21},{"t":"q","kind":"mc","stem":["How did the team respond to her first mistakes?"],"options":["They replaced her","They offered suggestions","They cancelled the project","They ignored her"],"mark":"B","pts":0.25,"explain":"They provided advice without taking control.","n":22},{"t":"q","kind":"mc","stem":["How did An feel after the presentation?"],"options":["Angry","Disappointed","Proud","Bored"],"mark":"C","pts":0.25,"explain":"She felt proud after the community meeting.","n":23},{"t":"q","kind":"mc","stem":["What did An learn about independence?"],"options":["Never accept help","Always work alone","Avoid responsibility","Take responsibility and seek advice when needed"],"mark":"D","pts":0.25,"explain":"Her conclusion combines responsibility with asking for advice.","n":24},{"t":"heading","text":"PART II. WRITING (4.0 POINTS)"},{"t":"instruction","text":"Write the correct word or complete each sentence as instructed."},{"t":"q","kind":"write","stem":["Complete the word form: My parents support my growing ______. (INDEPENDENT)"],"options":[],"starter":"","mark":"independence","pts":1.0,"section":"word","explain":"Independence is the required noun.","n":25},{"t":"q","kind":"write","stem":["Complete the sentence: Good time ______ helps students meet deadlines."],"options":[],"starter":"","mark":"management","pts":1.0,"section":"word","explain":"Time management is the correct collocation.","n":26},{"t":"q","kind":"write","stem":["Rewrite: It is important to check the details first. Use SHOULD."],"options":[],"starter":"You ","mark":"should check the details first","pts":1.0,"section":"transform","explain":"Should + bare infinitive expresses advice.","n":27},{"t":"q","kind":"write","stem":["Rewrite: I began learning this skill last y
