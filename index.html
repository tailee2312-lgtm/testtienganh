ear. Use HAVE."],"options":[],"starter":"I have been learning this skill ","mark":"since last year","pts":1.0,"section":"transform","explain":"The present perfect with since shows an action begun in the past.","n":28}]},{"id":"practice4","title":"Đề luyện 4 · Everyday English","year":"2026","minutes":45,"source":"https://loigiaihay.com/de-so-4-de-kiem-tra-giua-ki-1-tieng-anh-11-moi-a83846.html","external":true,"originalPractice":true,"total":10,"header":{"left":"GRADE 11 · MIDTERM PRACTICE","right":"PRACTICE PAPER 04\nSCHOOL YEAR 2026–2027","subject":"ENGLISH · GRADE 11","originalTime":"Time allowed: 45 minutes"},"items":[{"t":"heading","text":"PART I. MULTIPLE CHOICE (6.0 POINTS)"},{"t":"instruction","text":"Choose the correct answer A, B, C or D for each question."},{"t":"q","kind":"mc","stem":["Choose the word whose -ed ending is pronounced differently."],"options":["invited","started","cleaned","wanted"],"mark":"C","pts":0.25,"explain":"Cleaned ends /d/; the others end /ɪd/.","under":"ed","n":1},{"t":"q","kind":"mc","stem":["Choose the word whose -s ending is pronounced differently."],"options":["watches","matches","teaches","books"],"mark":"D","pts":0.25,"explain":"Books ends /s/; the others end /ɪz/.","under":"s","n":2},{"t":"q","kind":"mc","stem":["Choose the word whose vowel differs."],"options":["break","great","steak","bread"],"mark":"D","pts":0.25,"explain":"Bread has /e/; the others have /eɪ/.","n":3},{"t":"instruction","text":"Choose the word with a different main stress pattern."},{"t":"q","kind":"mc","stem":["Choose the word with a different stress pattern."],"options":["community","recycling","technology","exercise"],"mark":"D","pts":0.25,"explain":"Exercise is stressed on the first syllable.","n":4},{"t":"q","kind":"mc","stem":["Choose the word with a different stress pattern."],"options":["suggest","prepare","visit","decide"],"mark":"C","pts":0.25,"explain":"Visit has stress on the first syllable.","n":5},{"t":"instruction","text":"Choose the best answer to complete each sentence."},{"t":"q","kind":"mc","stem":["By the time we arrived, the workshop ______."],"options":["starts","had started","has started","was starting"],"mark":"B","pts":0.25,"explain":"Past perfect describes the earlier action.","n":6},{"t":"q","kind":"mc","stem":["The new student speaks English very ______."],"options":["clear","clearly","clarity","clearing"],"mark":"B","pts":0.25,"explain":"The adverb clearly modifies speaks.","n":7},{"t":"q","kind":"mc","stem":["I enjoy ______ information with my classmates."],"options":["share","to share","sharing","shared"],"mark":"C","pts":0.25,"explain":"Enjoy is followed by a gerund.","n":8},{"t":"q","kind":"mc","stem":["The lecture was ______ interesting that nobody left early."],"options":["so","such","too","very"],"mark":"A","pts":0.25,"explain":"So + adjective + that.","n":9},{"t":"q","kind":"mc","stem":["Our school is planning ______ a small vegetable garden."],"options":["build","building","to build","built"],"mark":"C","pts":0.25,"explain":"Plan to do something.","n":10},{"t":"q","kind":"mc","stem":["Although it was raining, the students ______ with the clean-up."],"options":["carried on","carried away","carried out of","carried up"],"mark":"A","pts":0.25,"explain":"Carry on means continue.","n":11},{"t":"q","kind":"mc","stem":["The teacher reminded us ______ our phones during the test."],"options":["not use","not to use","not using","to not using"],"mark":"B","pts":0.25,"explain":"Remind somebody not to do something.","n":12},{"t":"q","kind":"mc","stem":["That is the student ______ won the science prize."],"options":["which","whose","who","where"],"mark":"C","pts":0.25,"explain":"Who is a relative pronoun for people.","n":13},{"t":"q","kind":"mc","stem":["This project requires both creativity ______ teamwork."],"options":["nor","or","but","and"],"mark":"D","pts":0.25,"explain":"Both ... and ... is the correct correlative structure.","n":14},{"t":"q","kind":"mc","stem":["The museum, ______ opened last year, is free for students."],"options":["which","whose","who","where"],"mark":"A","pts":0.25,"explain":"Which introduces a non-defining relative clause.","n":15},{"t":"q","kind":"mc","stem":["I have been interested in science ______ I was a child."],"options":["for","since","while","during"],"mark":"B","pts":0.25,"explain":"Since introduces the start of a period.","n":16},{"t":"instruction","text":"Read the passage and choose the best word for each numbered blank."},{"t":"paragraph","text":"At Maple Secondary School, students have created an environmental team. Members meet every Wednesday to discuss ways to (17) ______ waste. They collect used paper, but they also explain why people should buy only what they (18) ______. Recently, the team designed posters using simple, (19) ______ messages. The posters are displayed near the cafeteria, where students can read them easily. The project is small, (20) ______ teachers believe that it is making a difference."},{"t":"q","kind":"mc","stem":[],"options":["reduce","receive","repeat","return"],"mark":"A","pts":0.25,"explain":"Reduce waste means create less rubbish.","n":17},{"t":"q","kind":"mc","stem":[],"options":["needs","need","needed","needing"],"mark":"B","pts":0.25,"explain":"The plural subject people takes need.","n":18},{"t":"q","kind":"mc","stem":[],"options":["clearness","clear","clearly","cleared"],"mark":"B","pts":0.25,"explain":"An adjective is needed before messages.","n":19},{"t":"q","kind":"mc","stem":[],"options":["or","because","but","unless"],"mark":"C","pts":0.25,"explain":"But contrasts small size with positive impact.","n":20},{"t":"instruction","text":"Read the following passage and answer the questions."},{"t":"paragraph","text":"The city library recently opened a repair corner where volunteers teach residents how to fix small household objects. Visitors bring items such as torn bags, broken lamps and bicycles with loose parts. The service is free, although visitors sometimes need to pay for replacement materials. The library does not promise that every object can be repaired. Instead, it encourages people to consider repairing something before buying a new one. Last Saturday, sixteen families attended a workshop on simple sewing techniques. Several participants said they enjoyed learning useful skills together. The organisers hope to offer more workshops next term."},{"t":"q","kind":"mc","stem":["What is the main purpose of the repair corner?"],"options":["To sell new products","To teach basic repair skills","To collect money for books","To replace every broken item"],"mark":"B","pts":0.25,"explain":"Volunteers demonstrate how to repair household objects.","n":21},{"t":"q","kind":"mc","stem":["When might visitors have to pay?"],"options":["When entering the library","When attending any workshop","When buying replacement materials","When speaking to volunteers"],"mark":"C","pts":0.25,"explain":"Materials may cost money though the service is free.","n":22},{"t":"q","kind":"mc","stem":["What happened last Saturday?"],"options":["A sewing workshop","A bicycle race","A book sale","A concert"],"mark":"A","pts":0.25,"explain":"Sixteen families attended a sewing workshop.","n":23},{"t":"q","kind":"mc","stem":["Which statement is true?"],"options":["All repairs are guaranteed","The library is closing","Visitors must buy new things","The library encourages repair before replacement"],"mark":"D","pts":0.25,"explain":"The service promotes trying to repair belongings first.","n":24},{"t":"heading","text":"PART II. WRITING (4.0 POINTS)"},{"t":"instruction","text":"Write the correct word or complete each sentence as instructed."},{"t":"q","kind":"write","stem":["Complete with the correct word: People can ______ energy by turning off unused lights."],"options":[],"starter":"","mark":"save","pts":1.0,"section":"word","explain":"Save energy is the correct collocation.","n":25},{"t":"q","kind":"write","stem":["Complete the word form: It was a ______ discussion. (PRODUCT)"],"options":[],"starter":"","mark":"productive","pts":1.0,"section":"word","explain":"Productive is the adjective required.","n":26},{"t":"q","kind":"write","stem":["Rewrite: The seminar was interesting. Everyone stayed. Use SO."],"options":[],"starter":"The seminar was ","mark":"so interesting that everyone stayed","pts":1.0,"section":"transform","explain":"So + adjective + that + clause.","n":27},{"t":"q","kind":"write","stem":["Rewrite: We began this club in 2024. Use SINCE."],"options":[],"starter":"We have ","mark":"run this club since 2024","pts":1.0,"section":"transform","explain":"The present perfect is used with since 2024.","n":28}]},{"id":"practice5","title":"Đề luyện 5 · Future Cities","year":"2026","minutes":45,"source":"https://loigiaihay.com/de-so-5-de-kiem-tra-giua-ki-1-tieng-anh-11-moi-a84003.html","external":true,"originalPractice":true,"total":10,"header":{"left":"GRADE 11 · MIDTERM PRACTICE","right":"PRACTICE PAPER 05\nSCHOOL YEAR 2026–2027","subject":"ENGLISH · GRADE 11","originalTime":"Time allowed: 45 minutes"},"items":[{"t":"heading","text":"PART I. MULTIPLE CHOICE (6.0 POINTS)"},{"t":"instruction","text":"Choose the correct answer A, B, C or D for each question."},{"t":"q","kind":"mc","stem":["Choose the word whose -s ending is pronounced differently."],"options":["streets","parks","buses","lights"],"mark":"C","pts":0.25,"explain":"Buses ends in /ɪz/; the others in /s/.","under":"s","n":1},{"t":"q","kind":"mc","stem":["Choose the word whose -ed ending is pronounced differently."],"options":["created","designed","planned","reused"],"mark":"A","pts":0.25,"explain":"Created ends in /ɪd/; the other three in /d/.","under":"ed","n":2},{"t":"q","kind":"mc","stem":["Choose the word whose vowel sound differs."],"options":["green","clean","great","street"],"mark":"C","pts":0.25,"explain":"Great contains /eɪ/; the others contain /iː/.","n":3},{"t":"instruction","text":"Choose the word with a different main stress pattern."},{"t":"q","kind":"mc","stem":["Choose the word with a different main stress pattern."],"options":["pollution","electric","environment","digital"],"mark":"D","pts":0.25,"explain":"Digital is stressed on the first syllable; the others are not.","n":4},{"t":"q","kind":"mc","stem":["Choose the word with a different main stress pattern."],"options":["convenient","sustainable","effective","personal"],"mark":"D","pts":0.25,"explain":"Personal has first-syllable stress.","n":5},{"t":"instruction","text":"Choose the best answer to complete each sentence."},{"t":"q","kind":"mc","stem":["In the future, smart sensors ______ traffic more efficiently."],"options":["managed","will manage","managing","has managed"],"mark":"B","pts":0.25,"explain":"Will + base verb describes a prediction.","n":6},{"t":"q","kind":"mc","stem":["Electric buses produce ______ emissions than diesel buses."],"options":["few","fewer","lesser","least"],"mark":"B","pts":0.25,"explain":"Fewer is used with countable plural nouns.","n":7},{"t":"q","kind":"mc","stem":["This street is safer ______ the council installed better lights."],"options":["since","until","unless","though"],"mark":"A","pts":0.25,"explain":"Since introduces the reason in this context.","n":8},{"t":"q","kind":"mc","stem":["The new park provides residents ______ an area for exercise."],"options":["with","for","about","from"],"mark":"A","pts":0.25,"explain":"Provide somebody with something.","n":9},{"t":"q","kind":"mc","stem":["Cycling lanes can ______ traffic congestion in the city centre."],"options":["reduce","reduction","reducing","reduced"],"mark":"A","pts":0.25,"explain":"Can is followed by the base verb.","n":10},{"t":"q","kind":"mc","stem":["The city plans to build more ______ housing for low-income families."],"options":["afford","affordable","affordably","affordance"],"mark":"B","pts":0.25,"explain":"An adjective is needed before the noun housing.","n":11},{"t":"q","kind":"mc","stem":["By 2035, many cities ______ more renewable energy than they do today."],"options":["used","were using","will be using","had used"],"mark":"C","pts":0.25,"explain":"Future continuous describes a likely ongoing future situation.","n":12},{"t":"q","kind":"mc","stem":["A smart device can send an alert ______ a problem is detected."],"options":["if","unless","despite","although"],"mark":"A","pts":0.25,"explain":"If expresses the condition.","n":13},{"t":"q","kind":"mc","stem":["Public transport should be accessible ______ everyone."],"options":["by","for","with","onto"],"mark":"B","pts":0.25,"explain":"Accessible for everyone is appropriate here.","n":14},{"t":"q","kind":"mc","stem":["The mayor asked experts ______ a safer pedestrian zone."],"options":["design","designing","designed","to design"],"mark":"D","pts":0.25,"explain":"Ask somebody to do something.","n":15},{"t":"q","kind":"mc","stem":["Cities need more trees, ______ can help reduce summer heat."],"options":["what","who","which","whose"],"mark":"C","pts":0.25,"explain":"Which refers back to trees.","n":16},{"t":"instruction","text":"Read the passage and choose the best word for each numbered blank."},{"t":"paragraph","text":"Many cities are experimenting with small changes before investing in major projects. One neighbourhood has replaced a car park with a public garden. Residents can now (17) ______ vegetables and meet their neighbours there. Another district uses sensors to monitor electricity (18) ______ in public buildings. The information helps managers find ways to save power. These solutions are not perfect, (19) ______ they show how planning can improve everyday life. Experts say that public feedback is (20) ______ when cities test new ideas."},{"t":"q","kind":"mc","stem":[],"options":["grow","build","drive","repair"],"mark":"A","pts":0.25,"explain":"Grow vegetables is the correct phrase.","n":17},{"t":"q","kind":"mc","stem":[],"options":["consume","consumption","consumer","consuming"],"mark":"B","pts":0.25,"explain":"Electricity consumption means the use of electricity.","n":18},{"t":"q","kind":"mc","stem":[],"options":["so","because","but","unless"],"mark":"C","pts":0.25,"explain":"But creates a contrast.","n":19},{"t":"q","kind":"mc","stem":[],"options":["essential","essentially","essence","nonessentially"],"mark":"A","pts":0.25,"explain":"The adjective essential follows the linking verb.","n":20},{"t":"instruction","text":"Read the following passage and answer the questions."},{"t":"paragraph","text":"A coastal city has introduced a new bus network powered partly by electricity. The local council hopes the service will make commuting quieter and more convenient. The buses stop near schools, hospitals and public parks. Passengers can check arrival times using digital signs at the stations, so owning a smartphone is not necessary. During the first two months, the council asked residents to report problems. Some passengers wanted earlier departures, while others asked for clearer signs. City planners used this feedback to improve the timetable. The council says that cleaner transport works best when people find it useful and affordable."},{"t":"q","kind":"mc","stem":["What powers the new bus network?"],"options":["Only diesel","Partly electricity","Only solar panels","Coal"],"mark":"B","pts":0.25,"explain":"The buses are powered partly by electricity.","n":21},{"t":"q","kind":"mc","stem":["Where can passengers see arrival times?"],"options":["Only on phones","On printed tickets","On digital station signs","In newspapers"],"mark":"C","pts":0.25,"explain":"Digital signs display the times.","n":22},{"t":"q","kind":"mc","stem":["How did planners improve the service?"],"options":["By ignoring comments","By closing stations","By doubling fares","By using passengers’ feedback"],"mark":"D","pts":0.25,"explain":"The timetable was changed in response to feedback.","n":23},{"t":"q","kind":"mc","stem":["Which principle is supported by the passage?"],"options":["Transport should be useful and affordable","All commuters need smartphones","Buses should avoid hospitals","Passengers should never comment"],"mark":"A","pts":0.25,"explain":"The final sentence stresses usefulness and affordability.","n":24},{"t":"heading","text":"PART II. WRITING (4.0 POINTS)"},{"t":"instruction","text":"Write the correct word or complete each sentence as instructed."},{"t":"q","kind":"write","stem":["Complete: A city that uses resources wisely is more ______. (SUSTAIN)"],"options":[],"starter":"","mark":"sustainable","pts":1.0,"section":"word","explain":"Sustainable is the adjective after more.","n":25},{"t":"q","kind":"write","stem":["Complete: Public ______ helps residents travel without private cars."],"options":[],"starter":"","mark":"transport","pts":1.0,"section":"word","explain":"Public transport is the correct collocation.","n":26},{"t":"q","kind":"write","stem":["Rewrite: This bus is not as expensive as that one. Use CHEAPER."],"options":[],"starter":"This bus is ","mark":"cheaper than that one","pts":1.0,"section":"transform","explain":"Comparative adjective + than.","n":27},{"t":"q","kind":"write","stem":["Rewrite: People can walk to school safely. Use SAFE."],"options":[],"starter":"It is ","mark":"safe to walk to school","pts":1.0,"section":"transform","explain":"It is + adjective + to-infinitive.","n":28}]},{"id":"gs1","title":"Global Success · Đề số 1","year":"Global Success – HKI","minutes":45,"source":"de-thi-giua-ki-1-tieng-anh-11-global-success-de-so-1-1697008878.pdf","total":10,"header":{"left":"TRƯỜNG THPT __________________","right":"ĐỀ KIỂM TRA GIỮA HỌC KỲ I\nTIẾNG ANH 11 – GLOBAL SUCCESS\nĐỀ SỐ 01","subject":"MÔN: TIẾNG ANH – LỚP 11","originalTime":"Thời gian làm bài: 45 phút"},"items":[{"t":"heading","text":"I. READING"},{"t":"subheading","text":"HEALTHY LIVING AND LIFE EXPECTANCY"},{"t":"paragraph","text":"Life expectancy can improve when people have access to healthcare, nutritious food, and a cleaner environment. Daily habits matter too: regular physical activity strengthens the body, while adequate sleep helps it recover. Smoking raises the risk of serious illness. Governments can encourage healthier living through public education and smoke-free public places."},{"t":"instruction","text":"Read the passage and choose the correct answer for each question."},{"t":"q","n":1,"stem":["Which factor can contribute to a longer life?"],"kind":"mc","section":"general","pts":0.25,"options":["Limited healthcare","Nutritious food and medical services","Less physical activity","Frequent smoking"],"mark":"B","explain":"Good nutrition and access to healthcare support a longer, healthier life.","replaced":true},{"t":"q","n":2,"stem":["According to the passage, what does adequate sleep help the body do?"],"kind":"mc","section":"general","pts":0.25,"options":["Recover","Avoid all exercise","Increase pollution","Develop unhealthy habits"],"mark":"A","explain":"Sleep allows the body to recover from daily activities.","replaced":true},{"t":"q","n":3,"stem":["Which habit increases the risk of serious illness?"],"kind":"mc","section":"general","pts":0.25,"options":["Walking regularly","Getting enough sleep","Smoking","Eating vegetables"],"mark":"C","explain":"Smoking is named as a major health risk.","replaced":true},{"t":"q","n":4,"stem":["What can governments do to encourage healthier living?"],"kind":"mc","section":"general","pts":0.25,"options":["Close all sports facilities","Discourage health education","Reduce access to doctors","Introduce smoke-free public places"],"mark":"D","explain":"Smoke-free public places are one public-health measure discussed.","replaced":true},{"t":"q","n":5,"stem":["What is the best title for this passage?"],"kind":"mc","section":"general","pts":0.25,"options":["Healthy Choices for a Longer Life","Dangerous Foods in Cities","Only Doctors Can Keep Us Healthy","Why Sleep Should Be Avoided"],"mark":"A","explain":"The passage discusses a combination of habits and public measures that support life expectancy.","replaced":true},{"t":"heading","text":"II. PHONETICS"},{"t":"paragraph","text":"Find the word which has a different sound in the part underlined."},{"t":"q","n":6,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["child","choose","charm","school"],"mark":"D","explain":"Kiến thức: Phát âm “ch”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"ch"},{"t":"q","n":7,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["cookbook","closing","muscle","clothing"],"mark":"C","explain":"Kiến thức: Phát âm “c”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"c"},{"t":"q","n":8,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["volumes","takes","laughs","develops"],"mark":"A","explain":"Kiến thức: Phát âm “s” Giải thích: Cách phát âm đuôi s, es:","under":"s"},{"t":"paragraph","text":"Choose the word which has a different stress pattern from the others."},{"t":"q","n":9,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["aquatic","respectful","extended","impolite"],"mark":"D","explain":"Kiến thức: Trọng âm. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":10,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["release","avoid","global","event"],"mark":"C","explain":"Kiến thức: Trọng âm. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"heading","text":"III. GRAMMAR AND VOCABULARY"},{"t":"paragraph","text":"Choose the best answer A, B, C or D to complete the sentences."},{"t":"q","n":11,"stem":["The government ______ changes to the voting system recently."],"kind":"mc","section":"general","pts":0.25,"options":["proposes","was proposing","proposed","has proposed"],"mark":"D","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Dấu hiệu: Câu có “recently” => động từ chia hiện tại hoàn thành."},{"t":"q","n":12,"stem":["His face looks funny. He ______ something in the kitchen now."],"kind":"mc","section":"general","pts":0.25,"options":["tasting","tasted","is tasting","taste"],"mark":"C","explain":"Kiến thức: Hiện tại tiếp diễn Giải thích: Câu có từ “now” nên động từ chia ở thì hiện tại. Trong câu này, “taste” mang"},{"t":"q","n":13,"stem":["She is the person who ______ me since I was a child."],"kind":"mc","section":"general","pts":0.25,"options":["has taken care of","took care of","takes care of","take care of"],"mark":"A","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Câu có “since + QKĐ” => mệnh đề phía trước chia hiện tại hoàn thành."},{"t":"q","n":14,"stem":["Australia ______ ASEAN’s first Dialogue Partner in 1974 and since then the country ______ with the organisation in a wide socio-economic range."],"kind":"mc","section":"general","pts":0.25,"options":["become, cooperate","has become, cooperated","became, has cooperated","became, cooperated"],"mark":"C","explain":"Kiến thức: Quá khứ đơn, hiện tại hoàn thành Giải thích: Mệnh đề phía trước chỉ sự việc diễn ra trong quá khứ, dấu hiệu: “in 1974” => động"},{"t":"q","n":15,"stem":["The proposal ______ to support the government’s effort to reduce energy use in public buildings."],"kind":"mc","section":"general","pts":0.25,"options":["is seeming","seems to","seemingly","seems"],"mark":"D","explain":"Kiến thức: Động từ nối Giải thích: “seem” là động từ nối nên không chia ở các thì tiếp diễn. Cấu trúc “seem + to V”:"},{"t":"paragraph","text":"Mark the letter A, B, C, or D to indicate the word(s) CLOSEST in meaning to the underlined word(s) in each of the following sentences."},{"t":"q","n":16,"stem":["Old people have an active lifestyle and are cared for by their families."],"kind":"mc","section":"general","pts":0.25,"options":["independent","simple","energetic","passive"],"mark":"C","explain":"Kiến thức: Từ đồng nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":17,"stem":["You will be unhealthy if you eat too many snacks."],"kind":"mc","section":"general","pts":0.25,"options":["harmful","nutritious","sick","injured"],"mark":"C","explain":"Kiến thức: Từ đồng nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Mark the letter A, B, C, or D to indicate the word(s) OPPOSITE in meaning to the underlined word(s) in each of the following sentences."},{"t":"q","n":18,"stem":["Spending more time outdoors can boost the body's strength and ability to function well"],"kind":"mc","section":"general","pts":0.25,"options":["power","health","weakness","injury"],"mark":"C","explain":"Kiến thức: Từ trái nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":19,"stem":["Getting enough sleep can reduce stress and improve your mood."],"kind":"mc","section":"general","pts":0.25,"options":["decrease","relieve","ease","increase"],"mark":"D","explain":"Kiến thức: Từ trái nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Make the correct form of the words in the brackets."},{"t":"q","n":20,"stem":["Many people are trying to adopt a _________ lifestyle these days. (HEALTH)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"healthy","starter":"→ ","explain":"Kiến thức: Loại từ Giải thích: Vị trí còn trống cần điền một tính từ bổ nghĩa cho danh từ “lifestyle” phía sau."},{"t":"q","n":21,"stem":["Stay healthy by eating well and exercising _________. (REGULAR)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"regularly","starter":"→ ","explain":"Kiến thức: Loại từ Giải thích: Vị trí còn trống cần điền một trạng từ đứng sau và bổ nghĩa cho danh động từ"},{"t":"q","n":22,"stem":["Just taking vitamin tablets will not turn an ________ diet into a good one. (HEALTH)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"unhealthy","starter":"→ ","explain":"Kiến thức: Loại từ Giải thích: Vị trí còn trống cần điền một tính từ bổ nghĩa cho danh từ “diet” phía sau."},{"t":"q","n":23,"stem":["She stays _________ so although she is 70 years old now (ACT)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"active","starter":"→ ","explain":"Kiến thức: Từ vựng Giải thích: Cấu trúc “stay + adj” => Vị trí còn trống cần điền một tính từ."},{"t":"q","n":24,"stem":["A _________ diet contains an adequate amount of all the nutrients required by the body to grow, remain healthy and be disease-free (BALANCE)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"balanced","starter":"→ ","explain":"Kiến thức: Từ loại Giải thích: Vị trí còn trống cần điền một tính từ bổ nghĩa cho danh từ “diet” phía sau."},{"t":"q","n":25,"stem":["These exercises are a great way to increase _________while maintaining flexibility. (STRONG)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"strength","starter":"→ ","explain":"Kiến thức: Từ loại Giải thích: Vị trí còn trống cần điền một danh từ đứng sau động từ “increase”."},{"t":"heading","text":"IV. READING"},{"t":"paragraph","text":"Choose the word or phrase among A, B, C or D that best fits the blank space in the following passage. Everyone knows that exercise is good for the body and the mind. We all want to keep fit and look good, but too many of us take (26) _______ the wrong sport and quickly lose interest. So now fitness experts are advising people to choose an activity that matches their character. For instance, those (27) _______ like to be with other people often enjoy golf or squash, or playing for a basketball, football, or hockey team. (28) _______, you may prefer to go jogging or swimming if you’re happier on your own. Do you like competition? Then try something like running, or a racket sport such as tennis. If, on the other hand, (29) _______ isn’t important to you, then activities like dancing can be an enjoyable (30) _______ without the need to show you’re better than everyone else. Finally, think about whether you find it easy to make yourself do exercise. If so, sports like weight training at home and cycling are fine. If not, book a skiing holiday, Taekwondo lessons, or a tennis court. You’re much more likely to do something you’ve already paid for!"},{"t":"q","n":26,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["down","out","in","up"],"mark":"D","explain":"Kiến thức: Cụm động từ Giải thích: Vị trí còn trống cần điền một giới từ đi với động từ “take” để tạo thành cụm động"},{"t":"q","n":27,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["who","whose","which","what"],"mark":"A","explain":"Kiến thức: Đại từ quan hệ Giải thích: Vị trí còn trống cần một đại từ quan hệ chỉ người."},{"t":"q","n":28,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["therefore","thus","however","while"],"mark":"C","explain":"Kiến thức: Liên từ. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":29,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["winners","winning","win","won"],"mark":"B","explain":"Kiến thức: Từ loại Giải thích: Vị trí còn trống cần điền một danh động từ làm chủ ngữ cho câu."},{"t":"q","n":30,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["challenge","victory","defeat","score"],"mark":"A","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"paragraph","text":"Read the following text and choose the correct answer. The family dynamic evolves as a teen matures and can test the parent-teen relationship. With both sides feeling mixed emotions, this time can be challenging. Puberty brings lots of emotions for teens and is a time of readjustment for the whole family. Parents have a huge influence on a young child’s values and interests, and so it can often feel hard for them to separate from their teen, who wants to develop their own identity and to have new freedoms. This may lead to conflict, as both parents and teens need time to figure out how to adapt the relationship. As teens get older, it is important for them to take on responsibilities. This highlights the valuable contribution each family member makes to a home and teaches teens about what it’s like to be an adult. Setting clear rules about routine and home life helps teens to know what’s expected of them - even if they do complain or resist. Expectations go both ways, however, and so constant communication and flexibility, when necessary, will help avoid conflict. It is important for parents and teens to overcome life’s many distractions in order to spend quality time together. For parents, maintaining a close relationship with a teen who is preprogrammed to separate from them can be tricky, but it helps to be present and willing. Talking about the things that are going well is as helpful as discussing areas of conflict."},{"t":"q","n":31,"stem":["What is the main idea of the passage?"],"kind":"mc","section":"general","pts":0.25,"options":["Puberty of teenagers","Teens’ romantic relationship","Parent-teen relationship","Teens’ responsibilities"],"mark":"C","explain":"Kiến thức: Đọc hiểu Giải thích: Ý chính của đoạn văn là gì?"},{"t":"q","n":32,"stem":["According to the passage, who are pointed out to considerably influence young child?"],"kind":"mc","section":"general","pts":0.25,"options":["their peers","their teachers","their parents","famous people"],"mark":"C","explain":"Kiến thức: Đọc hiểu Giải thích: Theo đoạn văn, ai được chỉ ra là có ảnh hưởng đáng kể đến trẻ nhỏ?"},{"t":"q","n":33,"stem":["The word “this” in paragraph 2 refers to ________."],"kind":"mc","section":"general","pts":0.25,"options":["Puberty brings lots of emotions for teens","Parents have a huge influence on a young child’s values and interests","Both parents and teens need time to adapt the relationship","Parents cannot separate from their teens who want to be free"],"mark":"D","explain":"Kiến thức: Đọc hiểu Giải thích: Từ “this” ở đoạn 2 đề cập đến ________."},{"t":"q","n":34,"stem":["The word “willing” is CLOSET in meaning to"],"kind":"mc","section":"general","pts":0.25,"options":["shocked","ready","strict","sympathetic"],"mark":"B","explain":"Kiến thức: Đọc hiểu Giải thích: Từ “willing: sẵn sàng” gần nghĩa với:"},{"t":"q","n":35,"stem":["Which of the following is NOT TRUE about the solution as teens get older?"],"kind":"mc","section":"general","pts":0.25,"options":["Complain and resist","Communicate constantly","Set rules about routine and home life","Ask teens to take on responsibilities"],"mark":"A","explain":"Kiến thức: Đọc hiểu Giải thích: Điều nào sau đây KHÔNG ĐÚNG về giải pháp khi thanh thiếu niên lớn lên?"},{"t":"heading","text":"V. WRITING"},{"t":"paragraph","text":"Rewrite the following sentences as long as the meaning is unchanged, using the given words."},{"t":"q","n":36,"stem":["This is the most beautiful city that I have ever visited. I have ____________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"never visited such a beautiful city","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: Cấu trúc câu hiện tại hoàn thành với “never”: “S + have/has + never + V-p2”: chưa"},{"t":"q","n":37,"stem":["Tom began playing the piano 4 years ago. Tom has ____________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"played the piano for 4 years","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “S + began/started + V-ing + time + ago” = “S + have/has + V-p2 + for + time”."},{"t":"q","n":38,"stem":["My advice is that you try to avoid all junk food. You _______________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"should avoid all junk food","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: Cấu trúc câu chỉ lời khuyên: “S + should/ought to + V-inf”: Bạn nên làm gì."},{"t":"q","n":39,"stem":["They don’t allow me to stay overnight at my friend's house. They don’t let ________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"me stay overnight at my friend's house","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: Cấu trúc “don’t allow + O + to + V-inf = don’t let + O + V-inf”: không cho phép"},{"t":"q","n":40,"stem":["That electric car’s so expensive that I don’t think I can buy it. It’s such _____________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"an expensive car that I don’t think I can buy it","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: Cấu trúc “ S + tobe + so + adj + that + clause” = “It is + such + a/an + adj + N +"}],"replacementQuestions":[1,2,3,4,5],"note":"Các câu Listening đã được thay bằng Reading/Grammar; phần còn lại theo đề PDF được cung cấp."},{"id":"gs2","title":"Global Success · Đề số 2","year":"Global Success – HKI","minutes":45,"source":"de-thi-giua-ki-1-tieng-anh-11-global-success-de-so-2-1697008425.pdf","total":10,"header":{"left":"TRƯỜNG THPT __________________","right":"ĐỀ KIỂM TRA GIỮA HỌC KỲ I\nTIẾNG ANH 11 – GLOBAL SUCCESS\nĐỀ SỐ 02","subject":"MÔN: TIẾNG ANH – LỚP 11","originalTime":"Thời gian làm bài: 45 phút"},"items":[{"t":"heading","text":"I. PHONETICS"},{"t":"paragraph","text":"Find the word which has a different sound in the part underlined."},{"t":"q","n":1,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["received","returned","replaced","improved"],"mark":"C","explain":"Kiến thức: Phát âm “-ed” Giải thích: Quy tắc phát âm đuôi “-ed”:","under":"ed"},{"t":"q","n":2,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["exhibit","vehicle","housing","honest"],"mark":"C","explain":"Kiến thức: Phát âm “h”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"h"},{"t":"paragraph","text":"Choose the word which has a different stress pattern from the others."},{"t":"q","n":3,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["model","design","impact","reduce"],"mark":"A","explain":"Kiến thức: Trọng âm. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":4,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["footprint","allow","limit","modern"],"mark":"B","explain":"Kiến thức: Trọng âm. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"heading","text":"II. GRAMMAR AND VOCABULARY"},{"t":"paragraph","text":"Choose the best answer A, B, C or D to complete the sentences."},{"t":"q","n":5,"stem":["His girlfriend ______ gentle and independent"],"kind":"mc","section":"general","pts":0.25,"options":["says","seems","acts","look"],"mark":"B","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":6,"stem":["Most people here use public ________ such as trains and electric buses."],"kind":"mc","section":"general","pts":0.25,"options":["places","transport","system","technology"],"mark":"B","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":7,"stem":["Young people don’t always understand their parents’ points of views. ________, they prefer to be free to make their own decisions."],"kind":"mc","section":"general","pts":0.25,"options":["However","Because","Furthermore","Yet"],"mark":"C","explain":"Kiến thức: Liên từ. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":8,"stem":["The ________ arises when Jack and his parents have considerable disagreement on his choice of university."],"kind":"mc","section":"general","pts":0.25,"options":["agreement","conflict","gap","conversation"],"mark":"B","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":9,"stem":["Spectators _________ show their tickets before they enter My Dinh stadium."],"kind":"mc","section":"general","pts":0.25,"options":["should","ought to","have to","must"],"mark":"C","explain":"Kiến thức: Động từ khuyết thiếu. Dựa vào ngữ cảnh và ki e the word(s) CLOSEST in meaning to the underlined word(s) in each of the following sentences."},{"t":"q","n":16,"stem":["Another factor lies in differences in musical tastes, fashion, and political views between young people and their parents"],"kind":"mc","section":"general","pts":0.25,"options":["ideas","tastes","opinions","visions"],"mark":"C","explain":"Kiến thức: Từ đồng nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":17,"stem":["Listening is an important part of the relationship between parents and children"],"kind":"mc","section":"general","pts":0.25,"options":["special","certain","helpless","vital"],"mark":"D","explain":"Kiến thức: Từ đồng nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Mark the letter A, B, C, or D to indicate the word(s) OPPOSITE in meaning to the underlined word(s) in each of the following sentences."},{"t":"q","n":18,"stem":["Smart cities are built on new technologies to improve people's lives."],"kind":"mc","section":"general","pts":0.25,"options":["affect","recover","enhance","worsen"],"mark":"D","explain":"Kiến thức: Từ trái nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":19,"stem":["He thinks he's special with his expensive suits and fancy shoes."],"kind":"mc","section":"general","pts":0.25,"options":["costly","reasonable","upmarket","luxurious"],"mark":"B","explain":"Kiến thức: Từ trái nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Make the correct form of the verbs in the brackets."},{"t":"q","n":20,"stem":["She (live) ________ in that house since she (be) ________ a child."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"has lived; was","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành & quá khứ đơn Giải thích: Mệnh đề trước “since” chia HTHT, mệnh đề sau “since” chia QKĐ: “S + have/has"},{"t":"q","n":21,"stem":["My daughter was studying with her friends when I (come) __________ home."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"came","starter":"→ ","explain":"Kiến thức: Quá khứ đơn Giải thích: Để diễn tả một hành động đang xảy ra thì một hành động khác xen vào: hành động"},{"t":"q","n":22,"stem":["I think teens should usually (have) _______ honest conversations with their parents to avoid conflicts."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"have","starter":"→ ","explain":"Kiến thức: Hiện tại đơn Giải thích: Vế trước chia hiện tại đơn, trong câu có “usually” => chỗ trống cần điền động từ"},{"t":"q","n":23,"stem":["My father (take up) ________ cycling several year ago."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"took up","starter":"→ ","explain":"Kiến thức: Quá khứ đơn Giải thích: Câu có “several year ago” => động từ chia quá khứ đơn."},{"t":"q","n":24,"stem":["I (already, finish) _________ reading the book that I (borrow) ________ from you last week."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"have already finished; borrowed","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành, quá khứ đơn Giải thích: Mệnh đề phía trước có “already” => động từ chia HTHT; mệnh đề phía sau có"},{"t":"q","n":25,"stem":["Thanks to his successful business, he (buy) ________ 3 cars so far."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"has bought","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Câu có “so far” => động từ chia hiện tại hoàn thành."},{"t":"heading","text":"III. READING"},{"t":"paragraph","text":"Choose the word or phrase among A, B, C or D that best fits the blank space in the following passage. Driving along the motorway in busy traffic, the driver suddenly presses a button on his steering wheel. The car is now driving itself. This may (26) ________ like something from the future, but driverless cars are already in reality on California’s roads. Many cars can already park themselves on the roadside, brake automatically when the car needs to slow down, and warn the driver (27) ________ they are slipping out of the right lane, so going driverless is just the next step towards automated driving. Driverless cars are equipped with fast broadband, allowing them to overtake other cars (28) ________, and even communicate with traffic lights as they approach junctions. Being stuck in traffic jams could become a thing of the past, as driverless cars will be able to drive at speed (29) ________ to each other. More than fifty million people die or are injured in road accidents every year, and the majority of these accidents is caused by human (30) ________ . Google’s driverless car sticks to the speed limit and doesn’t get tired. Why wouldn’t it be a great idea if all cars were driverless?"},{"t":"q","n":26,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["look","sound","feel","sense"],"mark":"B","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":27,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["if","where","why","what"],"mark":"A","explain":"Kiến thức: Câu điều kiện. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":28,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["nicely","quickly","harmlessly","safely"],"mark":"D","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":29,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["too closer","much closer","very closely","so closest"],"mark":"B","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":30,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["inaccuracy","offence","error","crime"],"mark":"C","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"paragraph","text":"Read the text and decide whether the statements are T (true) or F (false) NORMAL DIET FOR ADOLESCENTS – 12 TO 18 YEARS OF AGE 1. Changing Food Habits Teenagers are often very busy with school, work, and sports schedules. Help your teenager plan his day if he cannot be home for meals. Send healthy snacks or packed lunches with him. This will help him avoid filling up on \"junk\" foods or high fat foods. They may need extra snacks to take with them or meals they can prepare quickly. Your teenager still learns from your healthy eating habits. Be an example and praise his good food choices whenever you can. Never criticise the way your child looks at this time of life. Teenagers can easily become too worried about their body image. If they are eating too much or too little, it can affect their growth. Talk with your doctor if you are worried about your teenager's eating habits. 2. Food Group Choices Give your teenager at least one serving per day of a high vitamin C food. Examples are citrus fruits and juices, tomatoes, potatoes, and green peppers. Your teenager also needs one serving per day of a high vitamin A food. This includes spinach, winter squash, carrots, or sweet potatoes. Choose lean meats, fish, and poultry foods for your teenager. They are a source of proteins young people need in the period of growth. Also, give your teenager 2% milk and low-fat dairy foods. Avoid fried foods and high fat desserts; serve them only on special occasions. This will lower his risk for heart disease when he is older."},{"t":"q","n":31,"stem":["Parents should help their busy teenage children with planning their day."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False"],"mark":"T","starter":"→ ","labels":["T","F"],"explain":"Kiến thức: Đọc hiểu Giải thích: Cha mẹ nên giúp con cái đang bận rộn lập kế hoạch cho ngày của chúng."},{"t":"q","n":32,"stem":["Healthy snacks contain a lot of high fat foods."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False"],"mark":"F","starter":"→ ","labels":["T","F"],"explain":"Kiến thức: Đọc hiểu Giải thích: Đồ ăn nhẹ lành mạnh chứa nhiều thực phẩm giàu chất béo."},{"t":"q","n":33,"stem":["Teenagers are sensitive to the criticism of their appearance."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False"],"mark":"T","starter":"→ ","labels":["T","F"],"explain":"Kiến thức: Đọc hiểu Giải thích: Thanh thiếu niên rất nhạy cảm với những lời chỉ trích về ngoại hình của mình."},{"t":"q","n":34,"stem":["There are a lot of vitamins in vegetables."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False"],"mark":"T","starter":"→ ","labels":["T","F"],"explain":"Kiến thức: Đọc hiểu Giải thích: Trong rau củ có rất nhiều vitamin."},{"t":"q","n":35,"stem":["Fried foods and high fat desserts are very important in the developmental period of the youngsters."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False"],"mark":"F","starter":"→ ","labels":["T","F"],"explain":"Kiến thức: Đọc hiểu Giải thích: Đồ chiên, tráng miệng nhiều chất béo rất quan trọng trong giai đoạn phát triển của"},{"t":"heading","text":"WRITING"},{"t":"paragraph","text":"Rewrite the following sentences, using the suggestions."},{"t":"q","n":36,"stem":["She last wrote to me nearly 2 years ago. She hasn’t ______________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"written to me for 2 years","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “S + last + V-ed + time + ago” = “S + have/has + not + V-p2 + for + time”."},{"t":"q","n":37,"stem":["My father hasn’t driven a truck before. It’s the ________________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"first time my father has driven a truck","starter":"→ ","explain":"Cấu trúc: It is the first time + S + have/has + past participle. Câu hỏi gốc nói đến a truck."},{"t":"q","n":38,"stem":["He is interested in using networking sites in his free time. He is keen _____________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"on using networking sites in his free time","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: be interested in + V-ing = be keen on + V-ing: thích làm gì"},{"t":"q","n":39,"stem":["Am I required to show my identification card to process a bank transfer? Do I __________________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"have to show my identification card to process a bank transfer","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “be required + to V-inf = have to + V-inf”: bắt buộc/phải làm gì"},{"t":"q","n":40,"stem":["It took us only twenty minutes to finish the homework. We spent __________________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"only twenty minutes finishing the homework","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “It takes/took + sb + time + to V” = “S + spend/spent + time + V-ing”"}],"replacementQuestions":[],"note":"Các câu Listening đã được thay bằng Reading/Grammar; phần còn lại theo đề PDF được cung cấp."},{"id":"gs3","title":"Global Success · Đề số 3","year":"Global Success – HKI","minutes":45,"source":"de-thi-giua-ki-1-tieng-anh-11-global-success-de-so-3-1697017510.pdf","total":10,"header":{"left":"TRƯỜNG THPT __________________","right":"ĐỀ KIỂM TRA GIỮA HỌC KỲ I\nTIẾNG ANH 11 – GLOBAL SUCCESS\nĐỀ SỐ 03","subject":"MÔN: TIẾNG ANH – LỚP 11","originalTime":"Thời gian làm bài: 45 phút"},"items":[{"t":"heading","text":"I. PHONETICS"},{"t":"paragraph","text":"Find the word which has a different sound in the part underlined."},{"t":"q","n":1,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["gap","generation","grandparent","great"],"mark":"B","explain":"Kiến thức: Phát âm “g”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"g"},{"t":"q","n":2,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["believe","extend","respect","gender"],"mark":"D","explain":"Kiến thức: Phát âm “e”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"e"},{"t":"paragraph","text":"Choose the word which has a different stress pattern from the others."},{"t":"q","n":3,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["behave","differ","argue","follow"],"mark":"A","explain":"Kiến thức: Trọng âm. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":4,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["population","operation","infrastructure","exhibition"],"mark":"C","explain":"Kiến thức: Trọng âm. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"heading","text":"II. GRAMMAR AND VOCABULARY"},{"t":"paragraph","text":"Choose the best answer A, B, C or D to complete the sentences."},{"t":"q","n":5,"stem":["Quality of life will be improved ________ the cleaner environment."],"kind":"mc","section":"general","pts":0.25,"options":["thanks to","because","despite","in spite of"],"mark":"A","explain":"Kiến thức: Liên từ. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":6,"stem":["If people use more _______ energy, their negative impact on the environment will be decreased."],"kind":"mc","section":"general","pts":0.25,"options":["limited","renewable","non-renewable","fossil fuel"],"mark":"B","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":7,"stem":["She looks _______ because he gets good grades in the final exam."],"kind":"mc","section":"general","pts":0.25,"options":["unhappy","happily","happiness","happy"],"mark":"D","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":8,"stem":["______ is used for the cities that have too many people living in it."],"kind":"mc","section":"general","pts":0.25,"options":["population","overpopulated","overpopulation","popularity"],"mark":"C","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":9,"stem":["The volunteers design and _______ a project aiming at cleaning up some areas in their city."],"kind":"mc","section":"general","pts":0.25,"options":["carry out","make up","get around","give up"],"mark":"A","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":10,"stem":["Parents’ strict rules may put more _______ on teenagers."],"kind":"mc","section":"general","pts":0.25,"options":["happiness","problem","conflict","pressure"],"mark":"D","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":11,"stem":["Teenagers tend to be _______ and want to make their own decisions without being controlled by their parents."],"kind":"mc","section":"general","pts":0.25,"options":["dependent","independence","independent","dependence"],"mark":"C","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":12,"stem":["I think you ______ follow the doctor’s advice to keep fit."],"kind":"mc","section":"general","pts":0.25,"options":["shouldn’t","must","should","have to"],"mark":"C","explain":"Kiến thức: Động từ khuyết thiếu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":13,"stem":["________ fruit and vegetables play an important role in a healthy diet"],"kind":"mc","section":"general","pts":0.25,"options":["Raw","Fresh","Cooked","Frozen"],"mark":"B","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":14,"stem":["Both mental and _______ health should be taken care of carefully."],"kind":"mc","section":"general","pts":0.25,"options":["body","nutritious","mind","physical"],"mark":"D","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":15,"stem":["Generation gap refers ________ the difference in the ways of thinking and perception in the people of two different generations"],"kind":"mc","section":"general","pts":0.25,"options":["about","at","on","to"],"mark":"D","explain":"Kiến thức: Cụm động từ Giải thích: Vị trí còn trống cần điền một giới từ đi với động từ “refer”."},{"t":"paragraph","text":"Mark the letter A, B, C, or D to indicate the word(s) CLOSEST in meaning to the underlined word(s) in each of the following sentences."},{"t":"q","n":16,"stem":["You ought to give up smoking to protect your health"],"kind":"mc","section":"general","pts":0.25,"options":["continue","suffer","take up","stop"],"mark":"D","explain":"Kiến thức: Từ đồng nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":17,"stem":["Lack of sleep can lead to many health problems. We should sleep seven to eight hours a night."],"kind":"mc","section":"general","pts":0.25,"options":["prevent","solve","improve","cause"],"mark":"D","explain":"Kiến thức: Từ đồng nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Mark the letter A, B, C, or D to indicate the word(s) OPPOSITE in meaning to the underlined word(s) in each of the following sentences."},{"t":"q","n":18,"stem":["I can't concentrate on my work because of the noise outside."],"kind":"mc","section":"general","pts":0.25,"options":["focus","abandon","neglect","allow"],"mark":"C","explain":"Kiến thức: Từ trái nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":19,"stem":["We greatly respect my teacher for all the best lessons that she brought to us."],"kind":"mc","section":"general","pts":0.25,"options":["look up to","look for","look forwards","look down on"],"mark":"D","explain":"Kiến thức: Từ trái nghĩa. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Make the correct form of the verbs in the brackets."},{"t":"q","n":20,"stem":["______ you (ever, visit) _______ Hoi An Ancient town?"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"Have you ever visited","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Câu hỏi về một trải nghiệm, trong câu có “ever” => động từ trong câu chia hiện"},{"t":"q","n":21,"stem":["Everything is going well. We _________ (not have) any problems so far."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"haven't had","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Dấu hiệu: câu có “so far” => động từ trong câu chia hiện tại hoàn thành."},{"t":"q","n":22,"stem":["The police (arrest) _________ two men in connection with the robbery last night."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"arrested","starter":"→ ","explain":"Kiến thức: Quá khứ đơn Giải thích: Câu diễn tả sự việc đã xảy ra trong quá khứ, trong câu có “last night” => động từ"},{"t":"q","n":23,"stem":["We (know) __________ each other since we (be) _________ at high school."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"have known; were","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành; quá khứ đơn Giải thích: Mệnh đề trước “since” chia HTHT; mệnh đề sau “since” chia QKĐ: “S + have/has"},{"t":"q","n":24,"stem":["Jane (not talk) _________ with her parents since the argument last week."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"hasn't talked","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Mệnh đề trước “since” chia HTHT; mệnh đề sau “since” chia QKĐ: “S + have/has"},{"t":"q","n":25,"stem":["Over the past few years, Vietnam (become) _________ one of the most popular destinations for foreigners in Southeast Asia."],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"has become","starter":"→ ","explain":"Kiến thức: Hiện tại hoàn thành Giải thích: Câu có “over the past few years” => động từ trong câu chia hiện tại hoàn thành."},{"t":"heading","text":"III. READING"},{"t":"paragraph","text":"Choose the word or phrase among A, B, C or D that best fits the blank space in the following passage. When a person (26) _______ influenced by their friends or peers to adopt a particular type of behavior, fashion style or attitude in order to fit in, this is peer pressure. Feeling accepted is a strong driving force for people of all ages, and so learning how to deal (27) ______ peer pressure - both positive and negative - is an important life skill. Peer pressure is usually perceived as something negative, such as when a person feels compelled by their peers - whether friends or not - to do something that they don’t want to do. The teen years are the time when many people experiment and push boundaries, often because they want to (28) _______ their friends. While negative peer pressure makes a person feel unhappy, unwell, or uncomfortable, positive peer pressure boosts a person’s feelings of wellness and (29) _______. When individuals align themselves with positive people, the supportive atmosphere can lead to healthy choices. (30) ________, when friends join a club or sports team, or work hard to achieve good marks, it can have a positive effect on everyone in that group."},{"t":"q","n":26,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["remains","are","is","smells"],"mark":"C","explain":"Kiến thức: Câu bị động Giải thích: Vị trí còn trống cần điền một động từ tobe “is” để tạo thành câu bị động."},{"t":"q","n":27,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["to","with","of","about"],"mark":"B","explain":"Kiến thức: Cụm động từ Giải thích: Vị trí còn trống cần một giới từ đi với động từ “deal” để tạo thành cụm động từ"},{"t":"q","n":28,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["pursue","impress","adapt","suffer"],"mark":"B","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":29,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["arguments","conflicts","anger","happiness"],"mark":"D","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":30,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["For instance","However","Therefore","As a result"],"mark":"A","explain":"Kiến thức: Liên từ. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"paragraph","text":"Read the text and choose the correct answers. Where smart cities were once regarded purely as a vision of the future, they are now becoming a reality in numerous urban centres across the globe. From Dubai, Singapore, Amsterdam, Copenhagen, and Madrid to Southampton in the UK, we’re already beginning to see smart cities provide inhabitants with improved living conditions, easier mobility and cleaner, safer environments, by using cloud computing to power services. But as with all public sector initiatives, smart city services need to be delivered as cost effectively as possible to minimize the taxpayer burden. Often, key decision makers are met with obstacles when it comes to deploying smart services, preventing smart cities initiatives from reaching their full potential – or worse, blocking them altogether. Central to the functioning of most ‘normal’ city ecosystems is the underlying data they run on. Regardless as to whether that data is stored on local servers or using cloud storage, when that data is fragmented or incomplete, identifying emerging trends for strategic planning and cost reduction becomes extremely difficult – and because of this, authorities have to adopt an entirely reactive approach. Conversely, in a smart city environment, connected sensors forming an Internet of Things (IoT) provide valuable data for analysis and, in turn, insight into the specific city’s behavioral trends. With this level of information, services can be optimized to reduce costs and risk, increase urban flows and manage assets. Importantly, they can also provide real-time connections and interactions between the city’s businesses, local governments, service providers and citizens. In this way, operations and services are elevated through the integration and connections of physical devices via IoT networks, ultimately transforming how a city runs."},{"t":"q","n":31,"stem":["Which best serves as the title for the passage?"],"kind":"mc","section":"general","pts":0.25,"options":["A question of data.","Alignment of minds.","Smart city’s supporters.","The same old route."],"mark":"A","explain":"Kiến thức: Đọc hiểu Giải thích: Câu nào phù hợp nhất làm tiêu đề cho đoạn văn?"},{"t":"q","n":32,"stem":["According to paragraph 1, which statement is correct about the current situation for smart cities?"],"kind":"mc","section":"general","pts":0.25,"options":["Smart cities promise technological convenience so high service fees are not a problem.","Dubai, Amsterdam and Hampton are among the cities advancing the title of “smart”.","There still exist many challenges for the institution and development of smart cities.","The already successful smart city in the world were the works of policy-makers."],"mark":"C","explain":"Kiến thức: Đọc hiểu Giải thích: Theo đoạn 1, câu nào đúng về thực trạng thành phố thông minh hiện nay?"},{"t":"q","n":33,"stem":["The word “they” in paragraph 2 refers to ___________ ."],"kind":"mc","section":"general","pts":0.25,"options":["environments","ecosystems","services","initiatives"],"mark":"B","explain":"Kiến thức: Đọc hiểu Giải thích: Từ “they” ở đoạn 2 đề cập đến ___________."},{"t":"q","n":34,"stem":["According to paragraph 2, what is the matter that the author wants to emphasize?"],"kind":"mc","section":"general","pts":0.25,"options":["Human’s urge to share information.","The importance of data network.","The possibilities of tech disasters.","The caliber of artificial intelligence."],"mark":"B","explain":"Kiến thức: Đọc hiểu Giải thích: Theo đoạn 2, vấn đề mà tác giả muốn nhấn mạnh là gì?"},{"t":"q","n":35,"stem":["The word “elevated” in paragraph 3 can be replaced by __________."],"kind":"mc","section":"general","pts":0.25,"options":["demoted","controlled","dignified","upgraded"],"mark":"D","explain":"Kiến thức: Đọc hiểu Giải thích: Từ “elevate: được nâng cao” ở đoạn 3 có thể được thay thế bằng __________."},{"t":"heading","text":"WRITING"},{"t":"paragraph","text":"Rewrite the following sentences, using the suggestions."},{"t":"q","n":36,"stem":["If I were you, I would study harder to pass the exam. You _______________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"should study harder to pass the exam","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: Cấu trúc “ If I were you, I would …” = “You should …”."},{"t":"q","n":37,"stem":["Let’s go swimming together this afternoon! Why don’t ___________________________________?"],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"we go swimming this afternoon","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: Cấu trúc câu gợi ý, mời: “ Let’s + V-inf” = “Why don’t we + V-inf ?”."},{"t":"q","n":38,"stem":["The last time I saw her was in 2021. I ___________________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"haven't seen her since 2021","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “The last time + S + V-ed + was + time” = “S + have/has + not + V-p2 + since/for"},{"t":"q","n":39,"stem":["It’s not advisable for parents to compare their children to others’. Parents ______________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"shouldn't compare their children to others'","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “It’s not advisable for sb to V” = “S + shouldn’t + V-inf”."},{"t":"q","n":40,"stem":["It is forbidden for students to cheat in the exam Students ___________________________________."],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"mustn't cheat in the exam","starter":"→ ","explain":"Kiến thức: Cấu trúc tương đương Giải thích: “It is forbidden for sb to V = S + mustn’t + V-inf”: ai đó không được phép làm gì."}],"replacementQuestions":[],"note":"Các câu Listening đã được thay bằng Reading/Grammar; phần còn lại theo đề PDF được cung cấp."},{"id":"gs4","title":"Global Success · Đề số 4","year":"Global Success – HKI","minutes":45,"source":"de-thi-giua-ki-1-tieng-anh-11-global-success-de-so-4-1730257970.pdf","total":10,"header":{"left":"TRƯỜNG THPT __________________","right":"ĐỀ KIỂM TRA GIỮA HỌC KỲ I\nTIẾNG ANH 11 – GLOBAL SUCCESS\nĐỀ SỐ 04","subject":"MÔN: TIẾNG ANH – LỚP 11","originalTime":"Thời gian làm bài: 45 phút"},"items":[{"t":"heading","text":"I. PRONUNCIATION"},{"t":"paragraph","text":"Choose the word whose underlined part is pronounced differently from the others."},{"t":"q","n":1,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["crime","addiction","emergency","cost"],"mark":"C","explain":"Kiến thức: Phát âm “c”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"c"},{"t":"q","n":2,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["expensive","special","women","serious"],"mark":"B","explain":"Kiến thức: Phát âm “e”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"e"},{"t":"q","n":3,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["include","divide","title","invent"],"mark":"C","explain":"Kiến thức: Phát âm “i”. So sánh cách phát âm phần được gạch chân của bốn từ.","under":"i"},{"t":"paragraph","text":"Choose the word that has a stress pattern different from the others."},{"t":"q","n":4,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["invest","design","damage","depend"],"mark":"C","explain":"Kiến thức: Trọng âm của từ có hai âm tiết. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":5,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["survival","difficult","classical","business"],"mark":"A","explain":"Kiến thức: Trọng âm của từ có ba âm tiết. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"heading","text":"II. VOCABULARY & GRAMMAR"},{"t":"paragraph","text":"Choose the best option to complete each of the following sentences."},{"t":"q","n":6,"stem":["A website will be ________ to advertise this year’s SEA Games."],"kind":"mc","section":"general","pts":0.25,"options":["set up","found","formed","start up"],"mark":"A","explain":"Kiến thức: Cụm động từ. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":7,"stem":["My degree will help me get a good job _________ a high salary."],"kind":"mc","section":"general","pts":0.25,"options":["of","at","with","for"],"mark":"C","explain":"Kiến thức: Giới từ. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":8,"stem":["Agriculture activities __________ 18% of the Asia’s total greenhouse-gas emissions in 2015."],"kind":"mc","section":"general","pts":0.25,"options":["got","took","caused","made"],"mark":"C","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":9,"stem":["Policymakers and researchers need to better understand __________ biomass production affects food production."],"kind":"mc","section":"general","pts":0.25,"options":["how","what","who","when"],"mark":"A","explain":"Kiến thức: Từ để hỏi. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":10,"stem":["The __________ rate of this city is getting higher, so the inhabitants feel ing photos."],"mark":"A","explain":"Kiến thức: Kỹ năng giao tiếp. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":16,"stem":["Do you like the smell of durian? I think it smells___________."],"kind":"mc","section":"general","pts":0.25,"options":["pretty well","pretty good","very badly","so sweet"],"mark":"C","explain":"Kiến thức: Từ loại. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":17,"stem":["This carrot doesn’t _________ fresh."],"kind":"mc","section":"general","pts":0.25,"options":["sound","see","touch","taste"],"mark":"D","explain":"Kiến thức: Từ vựng. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"paragraph","text":"Write the correct form of the given words."},{"t":"q","n":18,"stem":["Vietnam ________ became ASEAN’s seventh member in 1995. (OFFICE)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"officially","starter":"→ ","explain":"Đối chiếu đáp án gốc: officially"},{"t":"q","n":19,"stem":["__________ happens when trees are cut down to make room for farming. (FOREST)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"Deforestation","starter":"→ ","explain":"Đối chiếu đáp án gốc: Deforestation"},{"t":"q","n":20,"stem":["Before purchasing a house, people should consider the ____________ of its neighborhood. (SECURE)"],"kind":"write","section":"word","pts":0.25,"options":[],"mark":"security","starter":"→ ","explain":"Đối chiếu đáp án gốc: security"},{"t":"heading","text":"III. READING"},{"t":"paragraph","text":"Choose the options that best complete the passage. YOUTH UNEMPLOYMENT IN BIG CITIES Unemployment is always a serious issue in any (21) __________especially when the rate of socio-economic development is speeding up. What are the major reasons for unemployment among young people? This problem is caused by a number of factors. Although unemployment has been a problem for a long time, it has become a more challenging (22) __________ issue in the last decades as a result of the massive migration of people from rural to urban areas, which increases the (23) __________rate of a city. Furthermore, the economic growth of large cities is linked to a higher rate of youth unemployment. This is because there are lots of job opportunities in the (24) __________so big cities generally attract a large number of young people looking for jobs. However, because of the recent economic problems, lots of companies have gone out of business. Consequently, more and more people have lost their jobs. To summarize, as the growth of big cities affects young people's quality of life and job opportunities, the government should support the young in (25) __________ areas to prevent the migration to cities by implementing effective policies."},{"t":"q","n":21,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["infrastructure","nation","culture","skyscraper"],"mark":"B","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":22,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["society","sociable","socialize","social"],"mark":"D","explain":"Kiến thức: Từ loại. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":23,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["population","safety","unemployment","security"],"mark":"C","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":24,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["factory","job market","business","world"],"mark":"B","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"q","n":25,"stem":[],"kind":"mc","section":"general","pts":0.25,"options":["urban","secure","modern","rural"],"mark":"D","explain":"Kiến thức: Từ vựng. Đối chiếu cách dùng từ, trọng âm hoặc cấu trúc trong bài."},{"t":"paragraph","text":"Read the passage and decide whether the statements are True, False or Doesn’t say. THE GENERATION GAP IN MY FAMILY The members of my family have a wide range of opinions. My father and my brother Jack are two members of my family who are totally different. My brother is artistic and creative while my father focuses on facts and technical details. One of the more humorous differences between them is their taste in music. My father loves listening to classical music, but my brother prefers EDM. Also, my brother bought many CDs to support his favorite band, and this made my father disappointed. My father told my mother that Jack shouldn't have spent a lot of money on those useless things. Another difference is that my brother is studying Visual Arts at university, but my dad was really angry when he found out about that. He said Jack should have studied business or marketing. My father said that learning arts couldn't help my brother to earn money. They didn't talk to each other for two years after my brother started his university studies. However, we are a loving family now. My father has become more understanding, and he regretted not being a good father. He said that he should have listened and encouraged Jack to do what he liked. My brother also said sorry. He said that he should have respected our father's opinions. It is amazing because my father and my brother are best friends now. Next week, we are going to Hawaii for our summer vacation, and I am really excited. We planned to take the trip in 2019, but it was canceled because my father and Jack did not talk to each other. However, everything is alright now, and I hope when something wrong happens in the future, our family can respect and listen to each other to find good solutions."},{"t":"q","n":26,"stem":["The writer's brother has great imagination."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False","Doesn't say"],"mark":"T","starter":"→ ","labels":["T","F","DS"],"explain":"Kiến thức: Đọc hiểu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":27,"stem":["The writer's father thought that buying CDs was a waste of money."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False","Doesn't say"],"mark":"T","starter":"→ ","labels":["T","F","DS"],"explain":"Kiến thức: Đọc hiểu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":28,"stem":["The writer's brother studied what his father wanted."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False","Doesn't say"],"mark":"F","starter":"→ ","labels":["T","F","DS"],"explain":"Kiến thức: Đọc hiểu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":29,"stem":["The writer's brother and father still ignore each other."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False","Doesn't say"],"mark":"F","starter":"→ ","labels":["T","F","DS"],"explain":"Kiến thức: Đọc hiểu. Dựa vào ngữ cảnh và kiến thức ngữ pháp hoặc nội dung bài đọc để chọn đáp án."},{"t":"q","n":30,"stem":["The writer's family will enjoy the wonderful summer vacation in Hawaii."],"kind":"mc","section":"rewrite","pts":0.25,"options":["True","False","Doesn't say"],"mark":"DS","starter":"→ ","labels":["T","F","DS"],"explain":"Đáp án đúng: DS."},{"t":"heading","text":"IV. WRITING"},{"t":"paragraph","text":"Write the sentences using the given words in brackets."},{"t":"q","n":31,"stem":["Eton didn't follow the curfew last night. (IGNORE) _____________________________________________"],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"Eton ignored the curfew last night.","starter":"→ ","explain":"Kiến thức: Từ đồng nghĩa. Kiểm tra từ loại hoặc cấu trúc biến đổi để giữ nguyên nghĩa câu gốc."},{"t":"q","n":32,"stem":["There's lots of seed oil and harmful fat in deep-fried foods. (RICH) _____________________________________________"],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"Deep-fried foods are rich in seed oils and harmful fat.","starter":"→ ","explain":"Kiến thức: Từ đồng nghĩa. Kiểm tra từ loại hoặc cấu trúc biến đổi để giữ nguyên nghĩa câu gốc."},{"t":"q","n":33,"stem":["Full cream milk is good for teenagers, but they generally avoid it. (SHOULDN'T) _____________________________________________"],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"Teenagers shouldn’t avoid full cream milk.","starter":"→ ","explain":"Kiến thức: Động từ khuyết thiếu. Kiểm tra từ loại hoặc cấu trúc biến đổi để giữ nguyên nghĩa câu gốc."},{"t":"q","n":34,"stem":["Too many bad carbs from sweetened snacks could cause early death. (RISK) _____________________________________________"],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"Too many bad carbs from sweetened snacks increase the risk of early death.","starter":"→ ","explain":"Kiến thức: Viết lại câu. Kiểm tra từ loại hoặc cấu trúc biến đổi để giữ nguyên nghĩa câu gốc."},{"t":"q","n":35,"stem":["Rebecca learned the survival skills at the summer camp, but she didn't remember. (REMEMBERED) _____________________________________________"],"kind":"write","section":"rewrite","pts":0.25,"options":[],"mark":"Rebecca should have remembered the survival skills which she learned at the summer camp.","starter":"→ ","explain":"Kiến thức: Động từ khuyết thiếu. Kiểm tra từ loại hoặc cấu trúc biến đổi để giữ nguyên nghĩa câu gốc."},{"t":"heading","text":"V. READING"},{"t":"subheading","text":"LEARNING AND LIVING IN SINGAPORE"},{"t":"paragraph","text":"Singapore attracts international students with modern libraries, digital learning spaces, and reliable public transport. New students may find the fast pace of city life challenging, especially when adapting to a different culture. Many universities offer orientation activities and study-skills workshops. Students who join clubs can make friends, practise communication, and become more confident about their future careers."},
